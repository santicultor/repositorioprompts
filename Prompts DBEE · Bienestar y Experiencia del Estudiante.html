{id:'deck-html',cat:'pres',t:'Presentación HTML interactiva de una sola pantalla',
 d:'Deck que se construye con cada clic o flecha, con modo presentador, imágenes ampliables, videos incrustados y archivo único que funciona sin internet.',
 out:['HTML'],attach:['~Imágenes y enlaces de video que quieras incluir'],
 vars:[T('tema','Tema'),S('publico','Público',['Estudiantes','Docentes y maestros','Directivos y comités','Equipo de Bienestar','Externos']),T('minutos','Duración (minutos)'),A('mensajes','Mensajes clave y contenido')],
 body:`Construye una presentación HTML interactiva sobre {{tema}} para {{publico}}, de {{minutos}} minutos.

MENSAJES CLAVE Y CONTENIDO:
{{mensajes}}

COMPORTAMIENTO
- Una sola pantalla fija: el contenido se construye con cada clic o flecha (nada de scroll largo).
- Navegación con flechas (←, →, PageUp/PageDown, Inicio/Fin), puntos de progreso y botón Atrás que restaura el estado.
- Imágenes en base64 con clic para ampliarlas (lightbox). Videos de YouTube incrustados como iframe, no como miniatura ni enlace.
- Modo presentador con notas en viñetas cortas (las preguntas retóricas empiezan con «?»).
- Archivo único que funciona sin internet, para auditorios sin conexión.

DISEÑO
#00205B, #00387B y blanco; Playfair Display + DM Sans; poco texto y mucho aire.

CALIDAD
- Nada de «borrador» ni texto de relleno visible.
- Si agregas o quitas diapositivas, actualiza los contadores de navegación y deja una sola diapositiva activa por mazo.
- Si hay una cifra o una noticia, indica la fuente y no uses nada que yo no pueda verificar.`,
 tips:['Se descartaron versiones «pasivas» (una persona decide, ramas falsas). Si la dinámica es interactiva, pide decisiones reales con consecuencias.','Con imágenes base64 largas, pide los cambios por script en lugar de buscar y reemplazar a mano.','Cuando te nombren empresas o noticias que no conoces, pide que verifique la fuente antes de incluirlas.'],
 src:'Jornada de Maestros, taller de Vibe Coding y presentaciones de comité'},

{id:'deck-comite',cat:'pres',t:'Presentación para comité: primero audita la propuesta',
 d:'Flujo en dos pasos: una auditoría de lo que falta o no cuadra y, solo después, la presentación interactiva con la decisión que se pide.',
 out:['HTML'],attach:['~La propuesta en Word, si es larga'],
 vars:[T('comite','Comité y tiempo disponible'),A('propuesta','Propuesta')],
 body:`Voy a presentar esta propuesta ante {{comite}}. Antes de construir nada, audítala.

PROPUESTA:
{{propuesta}}

PASO 1 · AUDITORÍA (máximo una página)
Dime qué falta o no cuadra: cronograma, matemática de cobertura frente a las metas, presupuesto (¿suman los totales?), gobernanza y responsables, indicadores y línea base. Prioriza lo que el comité va a preguntar.

PASO 2 · CONSTRUCCIÓN
Cuando yo responda a la auditoría, construye la presentación interactiva (HTML) de 12 diapositivas como máximo con: contexto, propuesta, cómo funciona, calendario, presupuesto interactivo, gobernanza y la decisión que se pide al comité.

REGLAS
- Mensajes en positivo: muestra avance y oportunidad; nada de «faltan X para llegar a la meta».
- Si un cambio mío tiene un efecto numérico oculto (por ejemplo, quitar un ciclo baja la cobertura del 83 % al 75 %), avísame antes de aplicarlo.
- Cuando una cifra sea una estimación mía y no un dato investigado, preséntala como estimación de trabajo pendiente de validación.`,
 tips:['En la propuesta de Reconocimientos, la auditoría detectó metas sin sustento y presupuestos inconsistentes antes de llegar al comité.','Cierra siempre con «lo que necesitamos que el comité decida».'],
 src:'Sistema de reconocimientos DBEE, Maratón Musical y expedientes'},

{id:'defensa-comite',cat:'pres',t:'Preguntas difíciles del comité: defender una cifra con honestidad',
 d:'Prepara respuestas a las preguntas probables sobre una cifra estimada sin fingir un respaldo que no existe.',
 out:['Texto'],attach:[],
 vars:[T('cifra','Cifra o decisión a defender'),A('origen','Cómo la estimaste (con honestidad)'),T('comite','Ante quién')],
 body:`Voy a defender ante {{comite}} esta cifra o decisión: {{cifra}}.

CÓMO LA ESTIMÉ:
{{origen}}

AYÚDAME A PREPARARME
1. ¿Qué preguntas difíciles me harían? (Máximo cinco, ordenadas por probabilidad.)
2. Para cada una, una respuesta corta y honesta que NO finja un respaldo que no existe.
3. Busca referencias externas (benchmarks, estudios) y dime con franqueza si validan o no mi cifra; si no la validan, no las fuerces.
4. Dame dos opciones de encuadre: (a) anclar la cifra a la capacidad real del presupuesto del área; (b) presentarla como estimación de trabajo pendiente de validación por el área responsable.
5. Propón de tres a cinco indicadores para medir el resultado y señala si falta una línea base.

Respuestas en viñetas, tono sereno.`,
 tips:['No pidas argumentos para «blindar» una cifra: pide la forma honesta de defenderla.','Ofrece alternativas de redacción en lugar de imponer una sola.'],
 src:'Justificación de montos de bonificación en el sistema de reconocimientos'},

/* ================= ACTIVACIONES Y TALLERES ================= */
{id:'stand-arquetipos',cat:'activ',t:'Activación de feria o stand con test de arquetipos',
 d:'Sistema completo: test tipo Buzzfeed, cartas coleccionables, dashboard para pantalla grande, pantalla de atracción con QR y versión de revisión para psicología.',
 out:['HTML','Texto'],attach:['~El QR de tu test en PNG, si ya lo tienes'],
 vars:[T('evento','Evento o feria'),T('publico','Público','por ejemplo, aspirantes de último año de colegio'),A('servicios','Servicios y datos verificados','',`Áreas de la DBEE: Prevención y Salud · CREA (éxito académico) · Cultura · Deportes · Fondo de Estudiantes · PAT (Programa Aprendamos a Trabajar). Servicios vinculados: Cursos Libres, CAF (Centro de Acondicionamiento Físico) y Misión Sabana. Concepto de comunicación: #ExperienciaBienestar. Agrega aquí los datos verificados de cada servicio (cifras, horarios, requisitos).`),A('arquetipos','Arquetipos','',`Alma Creativa · Competidor Nato · Eterno Aprendiz · Corazón que Transforma · Conector Social · Gran Explorador`)],
 body:`Diseña una activación de feria para {{evento}} dirigida a {{publico}}, con la idea: «En vez de explicar Bienestar, hacemos que la gente lo viva».

SERVICIOS Y DATOS VERIFICADOS:
{{servicios}}

ARQUETIPOS (puedes proponer ajustes, pero parte de estos):
{{arquetipos}}

ENTREGABLES
1. Test tipo Buzzfeed (ocho preguntas) que asigna un arquetipo; cada opción de respuesta muestra un dato institucional verificable relacionado con ESA respuesta (no con la pregunta).
2. Carta coleccionable por arquetipo (estilo FIFA/Pokémon) con barras de atributos y los servicios que le corresponden.
3. Dashboard para pantalla grande: un clic registra cada resultado, gráfico en vivo y rotación de información de servicios.
4. Pantalla de atracción con QR: animada, a pantalla completa y sin que se apague la pantalla.
5. Versión de revisión para el equipo de psicología, con el peso de cada respuesta y un campo de comentarios por opción.

DISEÑO
Colores #00205B, #00387B y blanco; tipografías Outfit y DM Sans.

REGLAS
- Cero estadísticas inventadas; si no hay dato, no hay dato: dímelo y no lo rellenes.
- Archivos HTML autocontenidos que funcionen sin internet en el computador del stand (los celulares de los visitantes sí necesitan conexión).
- Escribe «DBEE», no «BEE».`,
 tips:['Pide el texto de impresión (cartas, pendón) por separado y valida los datos con tu equipo antes de imprimir.','Un dato mostrado según la respuesta elegida engancha más que uno atado a la pregunta.','Se corrigieron estadísticas inventadas: reemplázalas por hechos institucionales verificables.'],
 src:'Stand en Barranquilla y feria para estudiantes de primer ingreso'},

{id:'historia-interactiva',cat:'activ',t:'Juego de decisiones tipo Bandersnatch para dar a conocer servicios',
 d:'Historia interactiva con decisiones reales, votación grupal, personajes, finales distintos y servicios integrados a la narrativa.',
 out:['HTML'],attach:[],
 vars:[T('publico','Público','por ejemplo, aspirantes de último año de colegio'),T('duracion','Duración','30 minutos'),A('areas','Áreas y servicios a mostrar (solo los que confirmes)')],
 body:`Crea un juego de decisiones tipo Bandersnatch para dar a conocer servicios universitarios a {{publico}}, en {{duracion}}.

ÁREAS Y SERVICIOS (solo los que yo confirme):
{{areas}}

DISEÑO
- Decisiones reales con consecuencias reales: rutas diferentes y finales distintos. Sin ramas falsas ni decisiones sin impacto.
- Votación grupal para grupos de 15 a 50 personas; decisiones rápidas (sin mecánica de deliberación).
- Personajes seleccionables con estadísticas iniciales propias, HUD tipo arcade y una pantalla de consecuencia entre cada voto.
- Los servicios aparecen dentro de la historia, no como paneles estáticos. Un estudiante invitado puede aparecer como personaje de la historia.
- Temporizador de esquina que indica qué área habla y cuánto tiempo le queda.
- Botón Atrás que restaura el estado completo.

ARCHIVO
Un solo HTML autocontenido que funcione sin internet (auditorio).

REGLAS
Usa solo nombres oficiales de programas y servicios. Si un programa está inactivo o no estás seguro de su estado, pregúntame en lugar de incluirlo. No dejes ninguna mención a «borrador».`,
 tips:['Se corrigió una etiqueta inventada («Kit de aterrizaje»): usa las categorías oficiales que aparecen en los documentos.','Prueba con cinco personas del equipo antes del evento y ajusta las decisiones que toman demasiado tiempo.'],
 src:'UniSabana Modo Historia (presentación a aspirantes)'},

{id:'taller-mapa',cat:'activ',t:'Taller de mapeo de servicios entre jefaturas',
 d:'Diseño de un taller para identificar traslapes, rutas compartidas y vacíos, con personas tipo, «hilos», «corchetes» y marcas diagnósticas.',
 out:['HTML','Texto'],attach:['~Catálogo de servicios por jefatura, si existe'],
 vars:[T('jefaturas','Jefaturas participantes','','Cultura, Deporte, Becarios, CREA, Centro Médico y Experiencia del Estudiante'),T('duracion','Duración','','4,5 horas'),T('personas','Quiénes participan','por ejemplo, unas 15 personas de los equipos de las seis jefaturas')],
 body:`Diseña un taller de {{duracion}} para mapear los servicios que ofrecen {{jefaturas}} a estudiantes de pregrado e identificar traslapes, rutas compartidas y puntos de conexión. Participan {{personas}}.

MODELO CONCEPTUAL
- Línea de tiempo en macroetapas (por ejemplo, primer año, trayectoria media y cierre de carrera), subdivididas por semestre; la admisión queda fuera.
- Personas tipo (pregrado): foráneo de primer semestre, estudiante en riesgo académico, estudiante de grupo representativo y estudiante ejemplar.
- «Hilo»: recorrido de una persona a lo largo del tiempo y de las jefaturas. «Corchete»: servicios similares de distintas jefaturas, sin importar el tiempo (posible duplicidad).
- Tipos de tarjeta: lineal (horario fijo), evento disparado (se activa por una señal) y ciclo recurrente (se repite cada semestre).
- Marcas diagnósticas explicadas en lenguaje simple: vacío, sobrecarga, huérfano y valor.

ENTREGABLES
1. Simulación paso a paso del taller en una sola pantalla (Anterior/Siguiente), con checklist previo y agenda de la jornada.
2. Una demo «de visión» (red animada con IA y respaldo local) para abrir la reunión y elevar la ambición.
3. Guion del facilitador.

Aclara que los datos de las demos son ilustrativos y no un inventario real.`,
 tips:['Se descartó el esquema de seis «momentos de transición» por poco convincente; el modelo por macroetapas funcionó mejor.','La demo se presenta como el «a dónde queremos llegar»; el taller es el «cómo recogemos los datos».','No dejes marcas diagnósticas sin explicación: pide que cada una se explique con un clic.'],
 src:'Taller de mapeo de servicios entre las seis jefaturas de la DBEE'},

{id:'sesion-colaborativa',cat:'activ',t:'App colaborativa para una sesión en vivo (QR, sin login)',
 d:'Herramienta para que un grupo construya algo en conjunto desde el celular y un facilitador lo ordene y exporte a PDF y Excel.',
 out:['HTML','Excel','PDF'],attach:['Excel con el catálogo o base de trabajo'],
 vars:[T('objetivo','Objetivo de la sesión'),T('participantes','Número de participantes'),T('catalogo','Base de trabajo','nombre del Excel')],
 body:`Diseña una herramienta web para una sesión colaborativa de {{participantes}} personas cuyo objetivo es: {{objetivo}}.

BASE DE TRABAJO: {{catalogo}}

REQUISITOS
- Fases controladas por el facilitador: Preparar (QR y sala de espera), Propuestas (ronda con tiempo), Debate (arrastrar y ordenar) y Cierre (exportar PDF y Excel).
- Los participantes entran por QR desde el celular, sin cuenta ni contraseña; vista móvil con pestañas.
- Solo el facilitador puede editar; deshacer con Ctrl+Z.
- Sincronización en tiempo real con una base en la nube y, si falla, respaldo local para que la sesión no se detenga.
- Botón de simulación para probar sin participantes reales.
- Interfaz «a prueba de tontos» y moderna.

ANTES DE CONSTRUIR
Analiza el archivo y avísame de problemas (duplicados, campos vacíos, filas que no aplican). Yo confirmo qué filtrar.`,
 tips:['Antes de construir se detectó que de 425 filas solo 260 eran de tipo «Formación»: revisar el archivo primero ahorra retrabajo.','Prueba con la simulación y con dos celulares antes del día de la sesión.'],
 src:'Sistema de rutas de formación tipo metro'},

{id:'actividad-artistica',cat:'activ',t:'Diseñar y presentar una actividad artística con respaldo científico',
 d:'De la idea al flujo de la sesión, resultados esperados, medición y una presentación breve; con referencias reales y límites explicados.',
 out:['HTML','PowerPoint'],attach:['~Fotos de referencia','~Cotizaciones o costos reales'],
 vars:[T('tema','Tema o propósito'),T('aforo','Participantes'),T('aliados','Aliados','por ejemplo, Centro Médico'),A('materiales','Lo que ya está definido (materiales, costos, maestros)')],
 body:`Ayúdame a diseñar y presentar una actividad artística sobre {{tema}}, para {{aforo}} participantes, en alianza con {{aliados}}.

LO QUE YA TENGO DEFINIDO:
{{materiales}}

ENTREGA
1. Dos o tres conceptos de actividad y nombres posibles; yo elijo.
2. Con el concepto elegido: flujo de la sesión paso a paso, resultados esperados (durante, después y a largo plazo) y cómo se medirán (por ejemplo, una escala de 1 a 5 al entrar y al salir).
3. Presentación breve de cinco diapositivas: portada con ambas áreas, flujo con respaldo científico, resultados esperados, recursos y costos, y referencias visuales.

REGLAS PARA EL RESPALDO CIENTÍFICO
- Cita estudios reales y revisables. Aclara si respaldan cada momento por separado o la combinación completa (casi nunca la combinación).
- Si un metaanálisis tiene advertencias de calidad metodológica, dilo.
- Marca con ⚠ lo pendiente: fecha, salón, créditos de las imágenes de referencia y la ruta de apoyo con el aliado.
- Usa solo los costos que yo te di.`,
 tips:['Dos sesiones de 22 personas resultaron más viables que una de 40.','Verifica la autoría de las imágenes de referencia antes de difundir.','Un buen nombre cambia la propuesta: pide alternativas y escoge.'],
 src:'Propuesta «Sentir en Color» para el Día de la Salud Mental'},

/* ================= DATOS Y DASHBOARDS ================= */
{id:'dash-informe',cat:'datos',t:'Informe en Word → dashboard HTML interactivo',
 d:'Convierte un informe de gestión en un tablero con secciones claras, gráficos y paleta institucional.',
 out:['HTML'],attach:['El informe en Word'],
 vars:[T('area','Área o coordinación'),T('periodo','Periodo','2026-1'),T('secciones','Secciones que debe tener (opcional)')],
 body:`Convierte el informe adjunto en un dashboard HTML interactivo para {{area}}, periodo {{periodo}}.

SECCIONES PEDIDAS: {{secciones}}

DISEÑO
- Un solo archivo HTML (Chart.js y fuentes por CDN), responsive y listo para imprimir.
- Pestañas claras; secciones separadas con divisores y títulos; jerarquía que se lea rápido.
- Paleta #00205B / #00387B / blanco; Playfair Display + DM Sans. Una portada de navegación (hub) en lugar de un resumen saturado.

CONTENIDO
- Todas las cifras exactas del informe; el nombre correcto de la unidad y de quien coordina (confírmalos conmigo).
- Si algo del informe es ambiguo, pregúntame antes de graficarlo.

TÉCNICA (para evitar errores conocidos)
- Define las funciones de navegación en el <head>, antes de que el HTML las invoque.
- Dibuja los gráficos solo cuando su pestaña es visible; no sobre canvas ocultos.
- Llena tablas y listas al cargar la página; deja los gráficos en una función aparte.
- Revisa que no queden comentarios HTML rotos que se vean como texto.`,
 tips:['La primera versión se vio desorganizada: pide secciones con divisores desde el inicio.','Se detectó un error en el nombre de una unidad (Coordinación Musical vs. Cultural): revisa los títulos.','Si un informe viene de otra área, pide que cite al coordinador responsable.'],
 src:'Dashboards de Coordinación Musical, Comunicaciones DBEE y Desarrollo Cultural 2026-1'},

{id:'dash-excel',cat:'datos',t:'Base en Excel → visualización interactiva (con mapa)',
 d:'Primero perfila los datos y reporta problemas; después construye un tablero con filtros cruzados y protege la información personal.',
 out:['HTML'],attach:['El Excel con los datos'],
 vars:[T('base','Nombre de la base'),A('preguntas','Qué quieres descubrir')],
 body:`Analiza la base de datos adjunta ({{base}}) y construye una visualización interactiva.

QUÉ QUIERO DESCUBRIR:
{{preguntas}}

PASO 1 · PERFIL DE DATOS (antes de graficar)
Cuéntame: filas y columnas, duplicados, valores vacíos o en cero, nombres ambiguos (por ejemplo, municipios que existen en varios departamentos) y cualquier columna con datos personales. Propón cómo tratar cada caso.

PASO 2 · VISUALIZACIÓN
- HTML autocontenido con filtros cruzados entre gráficos.
- Mapa de Colombia cuando haya datos geográficos (animaciones sobrias; vistas de calor y burbujas).
- Estética dinámica pero clara: «el mejor censo que se haya visto».
- Textos de hallazgos generados automáticamente a partir de los datos.

REGLAS DE PRIVACIDAD
- No incluyas nombres, correos, teléfonos, documentos ni códigos de estudiante en el archivo publicado; verifícalo con una revisión automática y dímelo.
- Los grupos muy pequeños (menos de cinco personas) se muestran agrupados.

PRUEBAS
Si no puedes abrir la página en un navegador real, dímelo de forma explícita. Revisa que ningún elemento reutilice nombres de clase CSS de otro componente.`,
 tips:['Un error real: dos componentes compartían la clase «bar» y las columnas se veían como bloques sólidos. Pide nombres de clase únicos.','Los datos con identificadores personales no van a una página publicada: sube solo agregados.','Pide que las advertencias de calidad (duplicados, vacíos, ambiguos) queden listadas al final del tablero.'],
 src:'Caracterización de estudiantes foráneos (925 estudiantes únicos)'},

{id:'excel-grupos',cat:'datos',t:'Cuadro en Excel para reporte de grupos',
 d:'Libro de Excel con datos validados, resumen con fórmulas, gráficos y hoja de notas con la fuente de cada dato.',
 out:['Excel'],attach:['~Datos base del periodo en Excel'],
 vars:[T('grupos','Grupos o población a reportar'),T('periodo','Periodo'),A('columnas','Columnas o información que debe llevar')],
 body:`Crea un libro de Excel para el reporte de {{grupos}} del periodo {{periodo}}.

COLUMNAS / INFORMACIÓN QUE DEBE LLEVAR:
{{columnas}}

HOJAS
1. Datos: una fila por grupo o por estudiante, con validación de datos (listas desplegables).
2. Resumen: totales, promedios y comparación con la meta mediante fórmulas (no valores pegados).
3. Gráficos: los dos o tres que mejor cuenten la historia.
4. Notas: fuente de cada dato y fecha de corte.

FORMATO
Encabezados en #00205B con texto blanco, filas alternadas en azul muy claro, columnas con ancho ajustado y filas congeladas. Hoja lista para pegar en PowerPoint o Teams.

Antes de entregar, revisa que las fórmulas no devuelvan errores y que los totales coincidan con los datos.`,
 tips:['Si el archivo trae datos de estudiantes, protégelo y evita códigos o documentos salvo que sea indispensable.','La hoja de Notas con la fuente ahorra discusiones en comité.'],
 src:'Función de asistente: cuadros en Excel para reportes de grupos'},

{id:'analisis-hix',cat:'datos',t:'Análisis de alineación con UniSabana Xperience y HIX',
 d:'Evalúa cómo una unidad o grupo contribuye a los rasgos de Xperience y cumple los ocho elementos de calidad HIX, con acciones para cerrar brechas.',
 out:['HTML','Excel','Word'],attach:['Tu tabla de actividades o evaluación (Excel), o pégala en el campo'],
 vars:[T('unidad','Unidad, jefatura o grupo'),A('tabla','Información: pega aquí tu tabla de actividades o evaluación')],
 body:`Analiza la alineación de {{unidad}} con UniSabana Xperience y con las Experiencias de Alto Impacto (HIX).

INFORMACIÓN DE LA UNIDAD:
{{tabla}}

${REF_XPERIENCE}

ENTREGA
1. Cómo contribuye {{unidad}} a los rasgos donde más aporta (Actitud Humanizadora y Conexión con el Entorno), con ejemplos tomados de la información.
2. Estado de cada uno de los ocho elementos HIX (barras o semáforo) y cuántas actividades lo cumplen.
3. Cuatro acciones concretas para cerrar brechas.
4. Aclaración explícita: no todas las actividades o grupos tienen que ser HIX.

REGLAS
Escribe «UniSabana Xperience». Si algo no está en la información, no lo supongas: dime qué falta.`,
 tips:['El marco de Xperience y los ocho elementos HIX ya vienen dentro del prompt; solo aportas tu tabla.','Sirve para repetir el mismo análisis en otras jefaturas con su propia tabla.'],
 src:'Dashboard de Desarrollo Cultural 2026-1 (sección Xperience y HIX)'}

);
PROMPTS.push(

/* ================= INVESTIGACIÓN Y EVIDENCIA ================= */
{id:'revision-literatura',cat:'invest',t:'Revisión de literatura con hipótesis (veredicto por hipótesis)',
 d:'Revisión científica rigurosa que valida o rechaza hipótesis con evidencia revisada por pares y una evaluación honesta de la calidad.',
 out:['Texto','Word'],attach:[],
 vars:[A('pregunta','Preguntas guía'),A('hipotesis','Hipótesis a validar o rechazar','H1 … H2 … H3 …'),T('poblacion','Población','estudiantes de pregrado'),T('periodo','Periodo principal','2021–2026'),T('enfasis','Énfasis geográfico','internacional, con énfasis en América Latina')],
 body:`Realiza una revisión rigurosa de literatura científica sobre:

PREGUNTAS GUÍA:
{{pregunta}}

HIPÓTESIS A VALIDAR O RECHAZAR:
{{hipotesis}}

ALCANCE
- Población: {{poblacion}}
- Periodo principal: {{periodo}} (incluye trabajos seminales)
- Bases: Scopus, Web of Science, ERIC, PsycINFO, PubMed, SciELO
- Énfasis geográfico: {{enfasis}}
- Solo artículos revisados por pares y fuentes verificables.

ENTREGA (en español)
1. Veredicto por hipótesis (validada, parcialmente validada o no validada) con el nivel de evidencia.
2. Marcos teóricos relevantes.
3. Calidad de la evidencia: sesgos, autoselección, tamaños de muestra.
4. Qué tipo de experiencia o característica marca la diferencia.
5. Evaluación honesta de la evidencia latinoamericana, incluyendo resultados nulos.
6. Recomendaciones prácticas por etapas.
7. Referencias completas.

REGLAS
Distingue con claridad qué es hallazgo, qué es inferencia tuya y qué no pudiste verificar. Si no encuentras una fuente, dilo; no la inventes.`,
 tips:['Después puedes pedir un deck de 12 diapositivas con los veredictos y una explicación de r, d y n para el equipo.','En la revisión de participación cultural y éxito académico las tres hipótesis quedaron «parcialmente validadas»; ese también es un resultado útil.'],
 src:'Revisión: participación cultural y éxito académico universitario'},

{id:'benchmark',cat:'invest',t:'Benchmark entre universidades con Deep Research (secuencia de tres prompts)',
 d:'Diseña una secuencia panorama → profundidad → vacíos para investigar qué hacen otras universidades y la consolida en un diagnóstico en Word.',
 out:['Word','Texto'],attach:['~Más adelante: los resultados de cada fase de Deep Research'],
 vars:[T('tema','Tema a investigar','becas e incentivos para grupos representativos'),T('universidades','Tipo de universidades'),T('pais','País o región')],
 body:`Voy a hacer un benchmark sobre {{tema}} en {{universidades}} de {{pais}}. Diseña una secuencia de tres prompts para una herramienta de Deep Research (sin enlaces; la herramienta busca sus propias fuentes).

PROMPT 1 · PANORAMA
Mapear qué universidades tienen programas de {{tema}}, por categoría (no solo por universidad), con tipo de apoyo y cobertura aproximada.

PROMPT 2 · PROFUNDIDAD
Qué beneficios se ofrecen realmente: monetarios y no monetarios, a quiénes cubren, cómo se financian, criterios de selección y sostenibilidad.

PROMPT 3 · VACÍOS
Universidades privadas de referencia que no aparecieron en las dos primeras búsquedas (te daré la lista).

DESPUÉS
Cuando te suba los resultados de cada fase, analízalos, dime qué huecos hay y ajusta el siguiente prompt. Al final, consolídalos en un diagnóstico en Word para circulación interna: tabla comparativa maestra, matriz de beneficios no monetarios, familias de modelos con ventajas y desventajas, referentes destacados, brechas y próximos pasos. Solo diagnóstico; todavía no propongas un modelo.`,
 tips:['El primer documento fue débil porque no detallaba qué ofrecen realmente los otros: exige «qué beneficios reales» desde el segundo prompt.','Una herramienta sirvió para amplitud de fuentes y otra para informes estructurados; combínalas.','Los referentes más sólidos fueron los que publican su normativa (decretos, reglamentos).'],
 src:'Becas e incentivos para grupos representativos (diagnóstico de 19 instituciones)'},

{id:'tabla-1hoja',cat:'invest',t:'Comparación en una hoja de Word (conclusión en negrilla + explicación)',
 d:'Investiga y compara instituciones en una tabla que cabe en una página, con conclusión clara al inicio de cada celda y lista honesta de fuentes.',
 out:['Word'],attach:[],
 vars:[T('entidades','Instituciones a comparar'),T('conceptos','Conceptos a comparar'),T('audiencia','Para quién es','por ejemplo, toda el área de Bienestar'),T('limite','Límite de extensión','una hoja de Word'),A('ref','Tu documento de referencia para contrastar (opcional): pega aquí el texto','','',true)],
 body:`Investiga y compara {{entidades}} en estos conceptos: {{conceptos}}.

PARA QUIÉN: {{audiencia}} (sin conclusiones atadas a programas de una sola área).
LÍMITE: {{limite}}

MI DOCUMENTO DE REFERENCIA (para contrastar):
{{ref}}
Si dice «ninguno», compara solo entre las instituciones.

FORMATO
- Tabla en Word con colores institucionales (#00205B, #00387B, blanco).
- En cada celda: primero una conclusión de una línea en negrilla; luego la explicación breve.
- Si hay terminología en otro idioma, deja la conclusión en español y el término original entre paréntesis.

FUENTES
- Prioriza fuentes primarias de cada institución (sus sitios y documentos oficiales).
- Al final, lista todas las fuentes y distingue cuáles leíste completas y cuáles solo viste como fragmentos de búsqueda. Si un documento estaba bloqueado, dilo.
- Cierra con una mini-conclusión de «aporte o contraste» por institución, de máximo dos párrafos.

Verifica que el Word quepa en el límite (conviértelo a PDF y revísalo) antes de entregarlo.`,
 tips:['La versión que funcionó empezó cada celda con la conclusión en negrilla, porque el concepto central a veces era confuso.','Algunas páginas de políticas en PDF bloquean la lectura automática: pide siempre la lista de fuentes con su nivel de lectura.','Si algo no se pudo rastrear a una fuente, que lo diga en lugar de dejarlo.'],
 src:'Referentes de éxito académico (Oxford y EAFIT) frente a los lineamientos de La Sabana'},

{id:'marco-teorico',cat:'invest',t:'Marco teórico conciso con analogía de entrada',
 d:'Redacta un marco teórico claro basado en el Modelo de Bienestar Institucional (incluido en el prompt), usando una analogía solo como gancho inicial.',
 out:['Word'],attach:[],
 vars:[T('tema','Tema'),T('analogia','Analogía de entrada (opcional)','','',true),T('secciones','Secciones que debe tener'),T('extension','Extensión','por ejemplo, 800 palabras'),A('fuente','Otras fuentes que quieras sumar (opcional): pega aquí el texto','','',true)],
 body:`Redacta un marco teórico conciso y claro sobre {{tema}}.

FUENTE PRINCIPAL
${REF_MODELO}

OTRAS FUENTES QUE PEGO:
{{fuente}}

ANALOGÍA DE ENTRADA: {{analogia}}
SECCIONES: {{secciones}}
EXTENSIÓN: {{extension}}

REGLAS
- Usa la analogía (si hay) solo como gancho narrativo en la introducción; el desarrollo es académico, profesional y sin adornos.
- Basa cada afirmación en las fuentes de arriba; no importes definiciones externas sin decírmelo.
- Cierra con tres preguntas validadoras que sirvan para evaluar cualquier propuesta nueva frente al modelo.
- Vocabulario institucional: «habilidades humanas», «UniSabana Xperience».`,
 tips:['Después puedes pedir la versión en Word institucional o ajustar el tono sección por sección.'],
 src:'Marco teórico del modelo de bienestar institucional'},

{id:'argumento-institucional',cat:'invest',t:'Argumentar una postura con los documentos institucionales',
 d:'Construye un argumento sólido anclado en el Modelo de Bienestar y en UniSabana Xperience (incluidos en el prompt), más un mensaje colegial para el equipo.',
 out:['Texto'],attach:[],
 vars:[A('tesis','Tu tesis o postura'),T('canal','Canal del mensaje','chat del equipo, correo, reunión')],
 body:`Quiero sostener esta tesis ante mi equipo: {{tesis}}

DOCUMENTOS DE RESPALDO (úsalos como única base institucional)
${REF_MODELO}

${REF_XPERIENCE}

TAREA
1. Construye el argumento usando SOLO lo que dicen los documentos de arriba; indica de cuál proviene cada idea.
2. Señala el riesgo conceptual de no usar el término o enfoque que propongo.
3. Redacta un mensaje para {{canal}}: directo, sustantivo y colegial; sin tono de reclamo.
4. Dame una versión corta (cinco líneas) y una de un párrafo.

Si los documentos no respaldan algo de mi tesis, dímelo con claridad en lugar de forzarlo.`,
 tips:['Funcionó para defender «habilidades humanas» frente a «habilidades para la vida»: el arte es un fin formativo, no solo un medio instrumental.','Si tu tesis depende de otro documento (por ejemplo, el PEI), pega el fragmento relevante en la tesis.'],
 src:'Posicionamiento del arte en el modelo de éxito académico'},

/* ================= COMUNICACIÓN ================= */
{id:'email-outlook',cat:'comu',t:'Correo HTML compatible con Outlook',
 d:'Correo con tablas y CSS en línea que sobrevive al motor de Outlook (escritorio y móvil), con imágenes sin deformar.',
 out:['HTML'],attach:['~Ilustración o imagen, si la vas a incluir'],
 vars:[T('asunto','Propósito del correo'),A('texto','Texto aprobado (pégalo tal cual)'),T('enlaces','Enlaces que irán como marcadores','portafolio, agendamiento…')],
 body:`Crea un correo HTML compatible con Outlook (escritorio y móvil) para: {{asunto}}.

TEXTO APROBADO (no lo reescribas ni lo acortes):
{{texto}}

ENLACES (déjalos como marcadores entre corchetes, por ejemplo [ENLACE_PORTAFOLIO]): {{enlaces}}

TÉCNICA
- Estructura de tablas con CSS en línea; ancho de 600.
- Tamaños de fuente en pt, con mso-line-height-rule:exactly y spans anidados para que sobrevivan al motor de Outlook.
- Georgia para titulares y Arial para el cuerpo; colores #00205B, #00387B y blanco.
- Imágenes: width="600", sin atributo height y con style="width:100%;max-width:100%;height:auto;". No recortes las ilustraciones que yo suba; incrústalas en base64.
- Hashtags y encabezados exactamente como los escribí.

ENTREGA
Archivo HTML y cinco opciones de asunto (con y sin emoji) para que yo escoja.`,
 tips:['Si en Outlook móvil la imagen se deforma, es por el atributo height: quítalo.','Los marcadores de enlaces se reemplazan al final; deja una lista de cuáles faltan.','Envía una prueba a tu celular antes de la difusión.'],
 src:'Campaña de correo de los 15 grupos (ocho versiones)'},

{id:'kit-correos',cat:'comu',t:'Kit de correos: invitación, confirmación, recordatorio y agradecimiento',
 d:'Cuatro correos con tono institucional listos para guardar como plantillas en Outlook.',
 out:['Texto'],attach:[],
 vars:[T('evento','Evento'),T('publico','Público'),A('datos','Datos clave (fecha, hora, lugar, enlace)'),T('contacto','Firma y contacto')],
 body:`Prepara un kit de cuatro correos para {{evento}}, dirigido a {{publico}}.

DATOS CLAVE:
{{datos}}

CORREOS
1. Invitación: gancho + datos + una sola llamada a la acción.
2. Confirmación: qué sigue, qué llevar y a quién escribir.
3. Recordatorio (24 horas antes): tres líneas.
4. Agradecimiento: cercano, con un resultado concreto y el siguiente paso.

REGLAS
- Cercano, profesional, inspirador; nunca burocrático.
- Cada correo con asunto, saludo, cuerpo y firma de {{contacto}}.
- Ajusta el tono al público (estudiantes: más directo; directivos: más sintético).
- Marca con ⚠ lo que falte.`,
 tips:['Guárdalos en Outlook como plantillas para reutilizarlos en cada evento.'],
 src:'Función de asistente: plantillas de invitación, confirmación y agradecimiento'},

{id:'comunicado',cat:'comu',t:'Comunicado interno o externo con tono UniSabana',
 d:'Mensajes adaptados al público (estudiantes, docentes, directivos o externos), en dos versiones etiquetadas.',
 out:['Texto'],attach:[],
 vars:[S('audiencia','Audiencia',['Estudiantes','Docentes y maestros','Directivos','Externos y aliados']),T('canal','Canal','correo, Teams, WhatsApp, redes'),A('mensaje','Mensaje central'),T('extension','Extensión','por ejemplo, máximo 120 palabras')],
 body:`Redacta un comunicado para {{audiencia}} por {{canal}}.

MENSAJE CENTRAL:
{{mensaje}}

REGLAS DE TONO
- Cercano, profesional e inspirador; nunca burocrático.
- Frases cortas, voz activa y lo importante primero.
- Vocabulario: «habilidades humanas», «UniSabana Xperience».
- Extensión: {{extension}}.
- Sin presiones: invita en lugar de exigir.

ENTREGA
Dos versiones etiquetadas (más cercana / más institucional) y una recomendación breve de cuál usar y por qué.`,
 tips:['Pedir versiones etiquetadas te permite escoger sin pedir reescrituras sucesivas.'],
 src:'Función de asistente: apoyo en comunicación'},

{id:'bases-concurso',cat:'comu',t:'Bases de un concurso institucional + brief gráfico + invitación a jurados',
 d:'Paquete completo para lanzar un concurso: bases, brief de diseño, copy, texto del formulario y correo a jurados, con criterios simples.',
 out:['Word','Texto'],attach:[],
 vars:[T('nombre','Nombre del concurso'),T('tema','Tema'),T('publico','Quiénes participan','por ejemplo, estudiantes de pregrado y posgrado'),T('formato','Formato de participación'),A('fechas','Fechas clave (lanzamiento, cierre, evaluación, premiación)'),A('criterios','Criterios de evaluación'),T('premios','Premios','o «por definir»')],
 body:`Diseña las bases de un concurso institucional de la Universidad de La Sabana: {{nombre}}.

TEMA: {{tema}}
PARTICIPAN: {{publico}}
FORMATO DE PARTICIPACIÓN: {{formato}}
FECHAS: {{fechas}}
CRITERIOS: {{criterios}}
PREMIOS: {{premios}}

ENTREGABLES
1. Bases del concurso en Word, con estas secciones: objeto, quiénes participan, cómo participar, criterios y ponderación, jurado, premios, cronograma, propiedad intelectual y tratamiento de datos personales.
2. Brief para el equipo de diseño de la pieza gráfica.
3. Texto del post y copy para redes.
4. Descripción y criterios para el formulario de inscripción.
5. Plantilla de correo de invitación a jurados.

PRINCIPIOS
- Simplicidad: pocos criterios (tres bastan), pesos fáciles de explicar y bonificación plana si hay un requisito de publicación.
- No puntúes la calidad técnica si quieres abrir la participación a cualquiera.
- Si el formato de los premios no está decidido, déjalo pendiente con ⚠.
- Si participa en redes, documenta dos caminos: publicar con un hashtag y perfil público, o entregar el archivo directamente.
- Los premios y el presupuesto no se inventan: usa solo los que te di.`,
 tips:['En Sabana Shorts se simplificó una fórmula de percentiles a una bonificación plana del 10 % y los criterios de cinco a tres: empieza por lo simple.','Si tienes las bases de un concurso anterior, pégalas en «criterios» o pide que las tome como referente de estructura.'],
 src:'Sabana Shorts 2026 (bases, brief, formulario y jurados)'},

{id:'acta-resultados',cat:'comu',t:'Acta de resultados de un concurso con verificación matemática',
 d:'Acta formal con ganadores, tabla final, alerta de empates y revisión de todos los puntajes.',
 out:['Word'],attach:['~Hoja de puntajes por jurado'],
 vars:[T('concurso','Concurso'),A('puntajes','Puntajes por jurado y criterio'),T('criterios','Ponderación de criterios')],
 body:`Genera el acta de resultados de {{concurso}}.

PUNTAJES POR JURADO Y CRITERIO:
{{puntajes}}

PONDERACIÓN: {{criterios}}

ENTREGA
1. Acta en Word con fecha, jurado, número de participantes, criterios, tabla final ordenada y ganadores.
2. Verificación matemática de cada puntaje: muéstrame el cálculo de una muestra y confirma el resto.
3. Alerta de empates y de qué posiciones afectan; si no afectan a los premiados, déjalo anotado para el futuro.
4. Confírmame: fecha del acta, si el número de participantes es el total y el formato del premio.`,
 tips:['En Sabana Shorts apareció un empate en las posiciones 7 y 8: no afectó a los ganadores, pero quedó anotado.'],
 src:'Acta de Sabana Shorts 2026 (13 participantes)'},

{id:'guion-portafolio',cat:'comu',t:'Guion cronometrado para presentar el portafolio de grupos',
 d:'Guion de cinco minutos adaptado a una audiencia específica, con tiempos, apoyos visuales y datos que debes confirmar. Pensado para Cultura; adaptable.',
 out:['Word'],attach:[],
 vars:[T('audiencia','Audiencia','por ejemplo, secretarios de cultura de municipios'),T('minutos','Duración (minutos)','','5'),A('destacados','Grupos a destacar y datos','',`Danza Folclórica Ancestros: tiene alianzas documentadas con casas de cultura de Tabio, Cogua, Cajicá, Sopó y Subachoque.
Coro UniSabana: fundado en 1987; participó en los World Choir Games (Ohio).
Tunas masculina y femenina: giras por Latinoamérica y Europa.
(Datos tomados del sitio oficial en una consulta anterior: confírmalos antes de usarlos.)`),T('contacto','Contacto para la última diapositiva','correo y teléfono')],
 body:`Escribe un guion cronometrado de {{minutos}} minutos para presentar el portafolio de grupos artísticos representativos de la Universidad de La Sabana ante {{audiencia}}.

${REF_GRUPOS}

GRUPOS A DESTACAR Y SUS DATOS:
{{destacados}}

CONTACTO PARA EL CIERRE: {{contacto}}

ESTRUCTURA
Gancho adaptado al público (30 s) → panorama de los 15 grupos por línea (música, danza y teatro) → foco en los grupos destacados → propuesta de colaboración pensada para este público → cierre con el contacto. Incluye marcas de tiempo y una sugerencia de apoyo visual por diapositiva.

REGLAS
- Usa solo los datos que te di. Si un grupo destacado no tiene datos, dímelo en lugar de inventar.
- Identifica cuál grupo es el mejor argumento para ESTE público (por ejemplo, alianzas ya existentes con entidades locales) y ponlo en el centro.
- No agregues logros, años ni adjetivos de ranking («el mejor», «el más grande») que yo no haya confirmado.`,
 tips:['Para secretarios de cultura municipales funcionó destacar un grupo con convenios locales ya documentados.','Los datos prellenados se verificaron en el sitio oficial en una consulta anterior; confírmalos antes de presentar.'],
 src:'Presentación para secretarios de cultura de Cundinamarca'},

{id:'informe-instalaciones',cat:'comu',t:'Consolidar comentarios en problemas priorizados + correo de solicitud',
 d:'Convierte muchos comentarios sueltos en categorías por urgencia y un único correo firme y respetuoso.',
 out:['Word','Texto'],attach:['~Fotos y videos para anexar al correo'],
 vars:[A('comentarios','Comentarios'),T('destinatario','Destinatario'),A('extra','Otros hallazgos directos (opcional)')],
 body:`Consolida los comentarios de abajo sobre infraestructura en categorías priorizadas y redacta un único correo a {{destinatario}}.

COMENTARIOS:
{{comentarios}}

OTROS HALLAZGOS DIRECTOS:
{{extra}}

ENTREGA
1. Informe breve en Word con categorías ordenadas por urgencia (urgente, alta, media), número de comentarios por categoría y una o dos citas representativas.
2. Un correo único, firme y respetuoso, que comunique la gravedad (qué clases se pierden o se interrumpen y cuánto tiempo), pida inspección urgente y mencione que se adjuntan fotos y videos.
3. Firma completa con cargo y datos de contacto.

No exageres: ordena por evidencia, no por dramatismo.`,
 tips:['Una sola solicitud consolidada tiene más fuerza que varias sueltas.'],
 src:'Encuesta de satisfacción de grupos (55 comentarios sobre instalaciones)'},

/* ================= ENCUESTAS E INSTRUMENTOS ================= */
{id:'encuesta-prepost',cat:'instr',t:'Encuesta pre/post para medir impacto (Microsoft Forms)',
 d:'Instrumento anclado al Modelo de Bienestar (incluido en el prompt), con código anónimo para emparejar respuestas y una lista de decisiones abiertas para validación.',
 out:['Texto','Excel','Word'],attach:[],
 vars:[T('programa','Programa o servicio a medir'),A('dimensiones','Dimensiones a medir (edítalas si tu programa es otro)','',`Redes de apoyo entre pares · Apropiación del ecosistema de Bienestar · Responsabilidad y autogobierno · Gestión emocional y expresión · Habilidades humanas · Autoeficacia y proyección · Bienestar y pertenencia institucional`),T('n','Número aproximado de ítems','','28'),A('criterios','Criterios de redacción propios de tu equipo (opcional)','','',true)],
 body:`Diseña un instrumento pre/post para medir el impacto de {{programa}} más allá de la asistencia.

DIMENSIONES A MEDIR:
{{dimensiones}}

${REF_MODELO}

${CRIT_ITEMS}
Criterios propios del equipo: {{criterios}}

REQUISITOS
- Anclado al Modelo de Bienestar de arriba; usa «habilidades humanas».
- Escala Likert de 1 a 5; aproximadamente {{n}} ítems cerrados más preguntas abiertas.
- Código anónimo autogenerado para emparejar el antes y el después sin identificar a nadie.
- Al final del semestre, pregunta solo por experiencias que requieran haber participado.

ENTREGA
1. Instrumento listo para pegar en Microsoft Forms, con ramificación de las preguntas abiertas según el momento (inicio o cierre).
2. Excel con objetivos y metodología, el instrumento con columnas de evaluación y los criterios de redacción.
3. Correo al equipo de psicología solicitando validación.
4. Lista de decisiones que dejas abiertas para esa validación (por ejemplo, ítems que podrían medir lo mismo).`,
 tips:['En la práctica, 21 de 28 ítems requerían ajuste por doble idea, deseabilidad social o ambigüedad: pide esa revisión desde el inicio.','Las siete dimensiones prellenadas se usaron para Grupos Representativos; cámbialas por las de tu programa.','El código autogenerado resolvió el emparejamiento sin recoger datos personales.'],
 src:'Encuesta de impacto de grupos representativos (siete dimensiones)'},

{id:'revision-items',cat:'instr',t:'Revisión de ítems uno a uno con criterios de redacción',
 d:'Método para refinar un instrumento psicométrico: diagnóstico, traslapes, lenguaje y opciones etiquetadas con recomendación.',
 out:['Word','Excel'],attach:[],
 vars:[T('instrumento','Instrumento'),T('indicador','Indicador en revisión'),A('items','Ítems a revisar: pégalos aquí'),A('criterios','Criterios de redacción propios de tu equipo (opcional)','','',true)],
 body:`Revisemos el instrumento {{instrumento}} ítem por ítem.

INDICADOR EN REVISIÓN: {{indicador}}

ÍTEMS A REVISAR:
{{items}}

${CRIT_ITEMS}
Criterios propios del equipo: {{criterios}}

PARA CADA ÍTEM
1. Diagnóstico: ¿cumple los criterios? ¿Cuál no?
2. Traslape: con otros ítems del mismo indicador y con otros indicadores.
3. Lenguaje: palabras ambiguas o subjetivas, coloquialismos, doble idea, negación, medir conocimiento en vez de conducta observable.
4. Propuesta: dos o tres opciones etiquetadas y una recomendación con una frase de justificación.

REGLAS
- Trabaja un ítem o un grupo pequeño a la vez.
- Si mi objeción sigue aplicando a tu propuesta, reconócelo y cambia el enfoque, no solo la redacción.
- Distingue lo cognitivo de lo metacognitivo; si un ítem pertenece a otro indicador, dímelo.
- Al terminar, consolida en Word (tabla por indicador) y en Excel en texto plano.`,
 tips:['El flujo correcto: revisar poco y bien, con opciones etiquetadas, y consolidar al final.','Fija las fronteras conceptuales (por ejemplo, flexibilidad cognitiva frente a monitoreo del aprendizaje) antes de redactar.'],
 src:'Instrumento de funciones cognitivas y metacognición (seis indicadores)'},

{id:'encuesta-wrapped',cat:'instr',t:'Encuesta de satisfacción tipo «Wrapped» + dashboard de resultados',
 d:'Encuesta de diapositivas deslizables con validaciones y un tablero filtrable por grupo, protegiendo la identidad de los estudiantes.',
 out:['HTML'],attach:['~Lista de grupos y directores','~Las respuestas en Excel, cuando ya las tengas, para armar el dashboard'],
 vars:[T('grupos','Grupos o servicios a evaluar'),A('criterios','Preguntas y criterios clave'),T('destino','Dónde guardar las respuestas','Google Sheets vía SheetDB, Microsoft Forms…')],
 body:`Crea una encuesta de satisfacción con experiencia tipo «Wrapped» (diapositivas deslizables) para {{grupos}}, y un dashboard con los resultados.

PREGUNTAS Y CRITERIOS CLAVE:
{{criterios}}

ENCUESTA
- Aproximadamente 17 diapositivas, animaciones sobrias, azul institucional; calificación con emojis.
- Campos obligatorios con validación (identificación de 6 dígitos, grupo, calificaciones, canal preferido).
- Guarda las respuestas en: {{destino}}. Usa un marcador [URL_DEL_SERVICIO] en lugar de la dirección real.

DASHBOARD
- Filtro por grupo en todos los gráficos, KPIs con color, calificación a directores por criterio, distribución de satisfacción, canales, comparativo entre grupos, citas destacadas y temas recurrentes.
- Conclusiones y acciones por grupo; los comentarios dirigidos a la coordinación se ven solo en la vista «Todos».

PRIVACIDAD
Los códigos de estudiante nunca deben aparecer en el dashboard publicado.

NOTAS TÉCNICAS
- SheetDB: activar CORS en su panel; enviar POST con Content-Type application/json y cuerpo {data:[{columna: valor}]}; no consultar más de una vez cada 20 segundos en el plan gratuito.
- Ensambla el HTML en Python separando datos y estructura para no romper el escape de caracteres.`,
 tips:['Nunca pegues URLs o claves de tu cuenta de SheetDB en un repositorio compartido: usa un marcador y configúralo al desplegar.','Si el envío falla con «Load failed», casi siempre es CORS desactivado, no la red.','Cuando agregues respuestas a mano desde Excel, confirma que no dupliques identificaciones.'],
 src:'Cultura Wrapped 2026-1 (143 respuestas) y su dashboard'},

{id:'riesgo-psicosocial',cat:'instr',t:'Recomendaciones por factor de riesgo desde la oferta real de un área',
 d:'Tabla en Excel con recomendaciones por nivel de riesgo que reflejan solo lo que tu área puede ofrecer, con advertencias de seguridad.',
 out:['Excel'],attach:[],
 vars:[T('area','Área que recomienda','por ejemplo, Desarrollo Cultural'),A('factores','Factores del instrumento','',`Familia · Compañeros · Recursos institucionales · Seguridad en la zona de vivienda · Carga académica · Profesores · Hábitos de alimentación · Recursos de vivienda`),A('oferta','La oferta real de tu área: programas, servicios, grupos, cursos','por ejemplo, 15 grupos representativos, cursos libres, agenda cultural, programa para estudiantes foráneos, HIX…')],
 body:`Crea un Excel con recomendaciones para los informes de un instrumento de riesgo psicosocial que llegarán a las facultades de la Universidad de La Sabana.

ÁREA QUE RECOMIENDA: {{area}}

FACTORES DEL INSTRUMENTO:
{{factores}}

NIVELES: Bajo · Medio · Alto

OFERTA REAL DEL ÁREA (única base para las recomendaciones):
{{oferta}}

REGLAS CLAVE
- Las recomendaciones reflejan SOLO lo que {{area}} puede ofrecer y hacer; no cites programas de otras áreas (cada área hará las suyas).
- Basa cada recomendación en la oferta real de arriba; no inventes programas.
- En factores fuera del alcance directo del área, escribe expresamente «sin intervención directa del área» en lugar de inventar una recomendación.
- Advertencias de seguridad: por ejemplo, con carga académica alta NO recomiendes actividades que exijan mucho tiempo (como grupos representativos), porque sumarían carga en vez de dar alivio.

FORMATO
Columnas con color por nivel; descripción del factor, recursos disponibles, pasos de activación y notas de contexto.`,
 tips:['La primera versión citaba demasiadas áreas externas: cada área debe recomendar solo desde su propia oferta.','Una advertencia explícita vale más que una recomendación forzada.','Los ocho factores prellenados son los del instrumento usado; cámbialos si el tuyo es otro.'],
 src:'Tabla de recomendaciones de riesgo psicosocial (ocho factores)'},

/* ================= REVISIÓN Y CALIDAD ================= */
{id:'auditoria-invencion',cat:'calidad',t:'Auditoría anti-invención de datos institucionales',
 d:'Revisa un documento antes de publicarlo y clasifica cada dato como confirmado, no verificable o posible invención. Solo reporta; no corrige.',
 out:['Texto'],attach:[],
 vars:[A('doc','Documento a revisar: pega aquí el texto'),A('fuentes','Fuentes válidas contra las que comparar: pega aquí datos oficiales o tus notas')],
 body:`Audita el documento de abajo antes de que yo lo publique. NO lo corrijas todavía: solo reporta.

DOCUMENTO A REVISAR:
{{doc}}

FUENTES VÁLIDAS (la única base para confirmar un dato):
{{fuentes}}

TAREA
Extrae cada dato verificable (cifras, fechas, logros, premios, nombres de programas, cargos, nombres de personas, descripciones de grupos) y clasifícalo en una tabla:
Dato | Dónde aparece | Estado (Confirmado en fuente · No verificable · Contradice la fuente · Posible invención) | Qué necesito confirmar.

BUSCA ESPECIALMENTE
- Adjetivos de ranking («una de las pocas», «la más grande»).
- Nombres de programas, categorías o servicios que no aparecen en las fuentes.
- Programas inactivos o de estado dudoso.
- Cifras redondeadas o estimadas presentadas como datos.

Al final, dame las cinco correcciones más urgentes.`,
 tips:['Casos reales: una etiqueta inventada («Kit de aterrizaje»), un grupo descrito con un ranking sin respaldo y una competencia mal nombrada.','Úsalo siempre antes de enviar algo a un comité, a imprenta o a un público externo.'],
 src:'Correcciones recurrentes en Modo Historia, inducciones y stands'},

{id:'aritmetica',cat:'calidad',t:'Verificación aritmética de presupuestos, horas y cronogramas',
 d:'Recalcula todo, muestra las operaciones, revisa coherencia de personas, noches y horas, y anticipa el efecto numérico de cada cambio.',
 out:['Texto'],attach:[],
 vars:[A('datos','Documento o datos a verificar')],
 body:`Verifica toda la aritmética de este documento:

{{datos}}

HAZ LO SIGUIENTE
1. Recalcula cada subtotal, total, promedio, porcentaje y duración. Muestra la operación (por ejemplo, 7 × $120.000 = $840.000).
2. Compara con lo que dice el documento y marca cada diferencia con la fuente de la discrepancia.
3. Revisa coherencia: número de personas usado en cada línea, noches de hotel, días de viaje, horas de mentores o instructores, cantidad de tiquetes por tipo.
4. Revisa que cada partida esté en el lugar correcto (no mezcles costos de producción con premios, ni horas de nómina con horas adicionales).
5. Antes de aplicar cualquier cambio que yo te pida, dime su efecto numérico en el total.

Entrega una tabla corta: Concepto | Valor en el documento | Valor correcto | Diferencia.`,
 tips:['Errores repetidos: partidas mal asignadas, número equivocado de personas y horas descritas como cubiertas por nómina cuando no lo estaban.','Hasta los cálculos «obvios» fallan: pide siempre ver la operación.'],
 src:'Presupuestos de ASCUN, Maratón Musical y Reconocimientos'},

{id:'cambios-quirurgicos',cat:'calidad',t:'Pedir cambios quirúrgicos a un archivo existente',
 d:'La forma más eficaz de editar: lista numerada, cambios puntuales, explicación de cada uno y aviso de consecuencias ocultas.',
 out:['Texto'],attach:['El archivo vigente'],
 vars:[T('archivo','Nombre del archivo'),A('cambios','Cambios numerados','1. … 2. … 3. …')],
 body:`Aplica SOLO estos cambios al archivo {{archivo}}. No lo reconstruyas ni modifiques nada más.

CAMBIOS (numerados):
{{cambios}}

REGLAS
1. Para cada cambio, dime qué modificaste y por qué, en una línea.
2. Si un cambio tiene una consecuencia oculta (cifras que cambian, otro texto que queda desactualizado, una sección que ya no cuadra), dímelo antes de aplicarlo.
3. Cuando haya Word y HTML paralelos, dame también el texto equivalente para el otro formato.
4. Al final, busca en el archivo cualquier rastro del texto antiguo y confirma que ya no queda.
5. Si un cambio puede hacerse de varias formas, ofréceme opciones; no me impongas una sola.`,
 tips:['Es el patrón más usado en la práctica: listas numeradas y cambios puntuales funcionan mejor que pedir una versión nueva.','Con archivos que tienen imágenes base64 largas, pide las ediciones por script.'],
 src:'Patrón de trabajo observado en más de 40 chats'},

{id:'pre-entrega',cat:'calidad',t:'Checklist de calidad antes de entregar',
 d:'Lista de verificación de marca, lenguaje, contenido y aspectos técnicos nacida de errores reales. Pégala al final de cualquier pedido.',
 out:['Texto'],attach:[],
 vars:[T('tipo','Tipo de entregable','HTML, Word, presentación…')],
 body:`Antes de entregarme este {{tipo}}, revisa esta lista y dime el resultado de cada punto.

MARCA Y LENGUAJE
□ Colores #00205B, #00387B y blanco; tipografías definidas (Playfair Display + DM Sans; Georgia en expedientes).
□ «UniSabana Xperience» (no «Experience»), «habilidades humanas» (no «blandas»), «DBEE» (no «BEE»).
□ Tono cercano y profesional; ningún encuadre defensivo ni de déficit.

CONTENIDO
□ Todos los datos provienen de lo que te di; lo pendiente está explícito.
□ Aritmética verificada (totales, horas, porcentajes).
□ Tildes y ñ intactas en todo el texto.
□ Sin «borrador», marcadores ni comentarios de trabajo visibles.
□ Nombres de personas, cargos y unidades coinciden con los que te di.

TÉCNICA
□ Si es HTML: funciona sin internet, sin errores en consola, una sola diapositiva activa por mazo, contadores de navegación correctos y etiquetas balanceadas.
□ Si es Word: cabe en las páginas pedidas (conviértelo a PDF y revísalo).
□ Sin datos personales que no deban publicarse.
□ Si no pudiste probarlo en un navegador real, dilo.`,

 src:'Errores recurrentes a lo largo del proyecto'},

TECNOLOGÍA: {{stack}}
DATOS QUE SE RECOGEN: {{datos}}

ENTREGA
1. Contexto y objetivo de la reunión en cinco líneas.
2. Explicación técnica: arquitectura, qué se almacena y dónde, solicitudes de red, almacenamiento local y qué registra el hosting (IP, fecha, agente), aclarando que es normal.
3. Explicación no técnica con una analogía sencilla (por ejemplo, un folleto digital interactivo).
4. Preguntas difíciles probables con respuesta para cada audiencia.
5. Cómo demostrarlo en vivo: abrir el inspector del navegador (F12 → Red) y mostrar que no hay envío de datos.
6. Postura de cierre: validar la preocupación del equipo sin ponerse a la defensiva y proponer una regla hacia adelante: toda app que recoja datos pasa por revisión de TI; las de solo presentación siguen el proceso actual.

Marco legal de referencia: Ley 1581 de 2012 (protección de datos personales en Colombia). Principio rector: «mostrar, no almacenar».`,

    const def=p.vars.find(x=>x.k===m[1]);
    const raw=Object.prototype.hasOwnProperty.call(v,m[1])?v[m[1]]:((def&&def.def)||'');
    let val=String(raw).trim();
    if(!val&&def&&def.opt)val='ninguno';
    if(val)return html?`<span class="fill">${esc(val)}</span>`:val;
    const lab='['+(def?def.l:m[1]).toUpperCase()+']';
    return html?`<mark>${esc(lab)}</mark>`:lab;
  }).join('');
}
const req=p=>(p.attach||[]).filter(a=>a[0]!=='~');
const tailOf=p=>req(p).length?'\n\nSi algún archivo o dato que menciono arriba no está en este chat, pídemelo antes de empezar y no inventes su contenido.':'';
const plainPrompt=p=>(ctxOn&&!p.noCtx?ctxText()+'\n\n———\n\n':'')+fillText(p,false)+tailOf(p);

function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);}

function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next=(cur?cur==='dark':sysDark)?'light':'dark';
  applyTheme(next);lsSet('dc_theme',next);

/* ---------- búsqueda ---------- */
function search(q){
  const w=norm(q).split(/\s+/).filter(Boolean);
  if(!w.length)return [];
  return PROMPTS.map(p=>{
    let s=0;
    for(const x of w){
      if(p._t.includes(x))s+=4;else if(p._w.includes(x))s+=2;else if(p._r.includes(x))s+=1;else return null;
    }
    return {p,s};
  }).filter(Boolean).sort((a,b)=>b.s-a.s).map(o=>o.p);
}

function field(v,p){
  const val=esc(Object.prototype.hasOwnProperty.call(valsOf(p),v.k)?valsOf(p)[v.k]:(v.def||''));
  if(v.t==='area')return `<div class="fld"><label for="f_${v.k}">${esc(v.l)}</label><textarea id="f_${v.k}" data-var="${v.k}" placeholder="${esc(v.ph)}">${val}</textarea></div>`;

  return `<div class="fld"><label for="f_${v.k}">${esc(v.l)}</label><input id="f_${v.k}" data-var="${v.k}" type="text" value="${val}" placeholder="${esc(v.ph)}"></div>`;
}
function viewPrompt(id){
  const p=byId[id];if(!p)return viewNotFound();
  const c=catById[p.cat];const f=favs.includes(id);
  let n=0;const N=()=>`<span class="num">${++n}</span>`;
  const left=[];
  const rq=req(p),op=(p.attach||[]).filter(a=>a[0]==='~').map(a=>a.slice(1));
  if(rq.length||op.length)left.push(`<section class="step"><h3>${N()} Lo que debes traer tú</h3><p class="hint" style="margin-bottom:8px">${rq.length?'Todo lo institucional (formatos, marco DBEE, tono) ya viene dentro del prompt. Solo necesitas adjuntar al chat de tu IA:':'No necesitas adjuntar nada. Si quieres, puedes sumar:'}</p><ul class="ul">${rq.map(a=>`<li><b>${esc(a)}</b></li>`).join('')}${op.map(a=>`<li>${esc(a)} <span class="hint">(opcional)</span></li>`).join('')}</ul></section>`);
  else left.push(`<section class="step ok1"><p style="font-size:14.5px">✓ <b>Listo para pegar.</b> Este prompt trae todo lo que necesita: no tienes que adjuntar nada.</p></section>`);
  if(p.vars.length)left.push(`<section class="step"><h3>${N()} Completa los datos</h3>${p.vars.map(v=>field(v,p)).join('')}</section>`);
  const right=`<section class="step"><div class="pvh"><h3>${N()} Copia tu prompt</h3>${p.noCtx?'':`<label class="tg"><input type="checkbox" id="ctxT" ${ctxOn?'checked':''}> Incluir contexto UniSabana</label>`}</div>
      <div class="pv" id="pv" tabindex="0" aria-label="Vista previa del prompt"></div>
      <button class="btn big" data-copy>📋 Copiar prompt</button></section>
    <section class="step"><h3>${N()} Pégalo en tu IA</h3><p class="hint" style="margin-bottom:10px">Copia el prompt y ábrelo en la herramienta que uses. Pégalo con Ctrl+V (⌘+V en Mac).</p>
      <div class="ai"><a class="btn ghost" data-ai href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Copiar y abrir Claude ↗</a>
      <a class="btn ghost" data-ai href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Copiar y abrir ChatGPT ↗</a>
      <a class="btn ghost" data-ai href="https://copilot.microsoft.com/" target="_blank" rel="noopener noreferrer">Copiar y abrir Copilot ↗</a></div></section>`;
  const rel=PROMPTS.filter(x=>x.cat===p.cat&&x.id!==id).slice(0,3);
  const next=['pre-entrega','cambios-quirurgicos'].filter(x=>x!==id&&byId[x]);
  return `<div class="in"><div class="vh">
    <div class="crumbs"><a href="#/">Inicio</a> › <a href="#/c/${c.id}">${esc(c.n)}</a> › <span>${esc(p.t)}</span></div>
    <div style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between">
      <h1>${esc(p.t)}</h1>
      <button class="star ${f?'on':''}" data-fav="${id}" aria-pressed="${f}" aria-label="${f?'Quitar de favoritos':'Guardar en favoritos'}" style="font-size:26px;flex:none">${f?'★':'☆'}</button></div></div>
    <div class="info3">
      <div class="inf"><h4>📍 ¿Cuándo usarlo?</h4><p>${esc(p.when)}</p></div>
      <div class="inf"><h4>🎁 ¿Qué obtienes?</h4><p>${esc(p.get)}</p></div>
      <div class="inf"><h4>📦 Formato y área</h4><div class="chips" style="margin-top:2px">${req(p).length?'<span class="chip need">📎 Requiere tus archivos</span>':'<span class="chip ok">✓ Listo para pegar</span>'}${p.out.map(o=>`<span class="chip">${o}</span>`).join('')}<span class="chip ar">${esc(p.ar)}</span></div></div></div>
    <div class="dgrid"><div>${left.join('')}
      ${p.tips&&p.tips.length?`<section class="step tip"><h3>💡 Lecciones de otras veces</h3><ul class="ul">${p.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${p.src?`<p class="src">Nació de: ${esc(p.src)}</p>`:''}</section>`:''}</div>
      <div class="stk">${right}</div></div>
    <section class="sec"><div class="sh"><h2>¿Y después?</h2></div><div class="nx">${next.map(x=>`<a href="#/p/${x}"><small>Siguiente paso recomendado</small><b>${esc(byId[x].t)}</b></a>`).join('')}</div></section>
    ${rel.length?`<section class="sec"><div class="sh"><h2>Más de «${esc(c.n)}»</h2><a href="#/c/${c.id}">Ver categoría →</a></div><div class="grid">${rel.map(pcard).join('')}</div></section>`:''}
    ${foot()}</div>`;
}
function updatePv(){
  const p=route.name==='prompt'?byId[route.id]:null;const el=$('#pv');if(!p||!el)return;
  el.innerHTML=(ctxOn&&!p.noCtx?`<span class="ctx">${esc(ctxText())}</span>`:'')+fillText(p,true)+esc(tailOf(p));
}

/* ---------- router ---------- */
function parse(){
  let h=(location.hash||'').replace(/^#\/?/,'');
  if(!h)return {name:'home'};
  const parts=h.split('/');
  const a=parts[0],b=parts.slice(1).join('/');
  if(a==='c')return {name:'cat',id:b||'all'};
  if(a==='p')return {name:'prompt',id:b};
  if(a==='buscar'){let q=b;try{q=decodeURIComponent(b);}catch(e){}return {name:'search',q};}
  if(['favs','recent','tools','rules','guia'].includes(a))return {name:a};
  if(byId[h])return {name:'prompt',id:h,legacy:true};
  return {name:'nf'};
}
let lastKey='';
function render(){
  route=parse();
  if(route.legacy){location.replace('#/p/'+route.id);return;}
  const key=route.name+'|'+(route.id||route.q||'');
  const changed=key!==lastKey;
  if(changed){outF='all';readyF=false;}
  let html='',title='Prompts DBEE',bar=false;
  switch(route.name){
    case 'home':html=viewHome();break;
    case 'cat':html=viewCat(route.id);title=(catById[route.id]?catById[route.id].n:'Todos los prompts');break;
    case 'favs':{const it=favs.map(id=>byId[id]).filter(Boolean);
      html=viewList('Mis favoritos','★','Los prompts que guardaste con la estrella. Se guardan en este navegador.',it,`<div class="empty"><b>Aún no tienes favoritos</b>Toca la ★ de cualquier prompt para guardarlo aquí y volver rápido.<div class="try"><a class="pl2" href="#/c/all">📚 Ver todos los prompts</a></div></div>`);title='Favoritos';break;}
    case 'recent':{const it=recents.map(id=>byId[id]).filter(Boolean);
      html=viewList('Recientes','🕘','Los últimos prompts que abriste.',it,`<div class="empty"><b>Todavía no has abierto ninguno</b>Cuando abras prompts, aparecerán aquí.</div>`);title='Recientes';break;}
    case 'search':html=viewSearch(route.q);title='Búsqueda: '+route.q;break;
    case 'tools':html=viewTools();title='Herramientas';break;
    case 'rules':html=viewRules();title='Reglas de oro';break;
    case 'guia':html=viewGuia();title='Guía rápida';break;
    case 'prompt':
      if(byId[route.id]){recents=[route.id].concat(recents.filter(x=>x!==route.id)).slice(0,8);lsSet('dc_recents',recents);title=byId[route.id].t;bar=true;}
      html=viewPrompt(route.id);break;
    default:html=viewNotFound();
  }
  document.title=title+' · Prompts DBEE';
  const main=$('#main');
  main.innerHTML=html+(bar?`<div class="mbar"><button class="btn" data-copy>📋 Copiar prompt</button></div>`:'');
  main.classList.toggle('hasbar',bar);
  renderSide();
  updatePv();
  document.body.classList.remove('menu');
  if(changed){window.scrollTo(0,0);}
  lastKey=key;
}
function rerender(){const y=window.scrollY;const keep=lastKey;render();lastKey=keep;window.scrollTo(0,y);}

/* ---------- copiar y avisos ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}
async function copyText(txt){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);return true;}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);const ok=document.execCommand('copy');document.body.removeChild(ta);return ok;}catch(e){return false;}
}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):favs.concat(id);lsSet('dc_favs',favs);return favs.includes(id);}

/* ---------- sugerencias del buscador ---------- */
function showSug(box,q){
  const sug=box.querySelector('.sug');if(!sug)return;
  q=q.trim();
  if(q.length<2){sug.hidden=true;sug.innerHTML='';return;}
  const res=search(q);
  if(!res.length){sug.innerHTML=`<div class="si all" style="cursor:default;color:var(--mut)">Sin resultados para «${esc(q)}». Prueba con otra palabra.</div>`;sug.hidden=false;return;}
  sug.innerHTML=res.slice(0,6).map(p=>`<a class="si" href="#/p/${p.id}"><span class="e" aria-hidden="true">${catById[p.cat].e}</span><div><b>${esc(p.t)}</b><span>${esc(p.when)}</span></div></a>`).join('')
    +`<a class="si all" href="#/buscar/${encodeURIComponent(q)}">Ver los ${res.length} ${res.length===1?'resultado':'resultados'} →</a>`;
  sug.hidden=false;
}
function hideSugs(){document.querySelectorAll('.sug').forEach(s=>{s.hidden=true;});}

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.closest('[data-menu]')){document.body.classList.add('menu');return;}
  if(t===$('#scrim')){document.body.classList.remove('menu');return;}
  if(t.closest('#side a')){document.body.classList.remove('menu');}
  if(t.closest('[data-theme]')){toggleTheme();return;}
  const fv=t.closest('[data-fav]');
  if(fv){e.preventDefault();const on=toggleFav(fv.dataset.fav);toast(on?'Guardado en favoritos ★':'Quitado de favoritos');rerender();return;}
  const out=t.closest('[data-out]');if(out){outF=out.dataset.out;rerender();return;}
  if(t.closest('[data-ready]')){readyF=!readyF;rerender();return;}
  const qb=t.closest('[data-q]');if(qb){location.hash='#/buscar/'+encodeURIComponent(qb.dataset.q);return;}
  if(t.closest('[data-copy]')){const p=byId[route.id];if(p){const ok=await copyText(plainPrompt(p));toast(ok?'Prompt copiado ✔ Ahora pégalo en tu IA':'No se pudo copiar: selecciona el texto de la vista previa');}return;}
  const ai=t.closest('[data-ai]');
  if(ai){const p=byId[route.id];if(p){copyText(plainPrompt(p)).then(ok=>toast(ok?'Prompt copiado ✔ Pégalo con Ctrl+V':'Abre la IA y pega el prompt a mano'));}return;}
  if(!t.closest('.sbox'))hideSugs();
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-search]');if(!f)return;
  e.preventDefault();
  const q=(f.querySelector('.sq').value||'').trim();
  if(q)location.hash='#/buscar/'+encodeURIComponent(q);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('sq')){showSug(t.closest('.sbox'),t.value);return;}
  if(t.dataset&&t.dataset.var){const p=byId[route.id];if(p){valsOf(p)[t.dataset.var]=t.value;updatePv();}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ctxT'){ctxOn=t.checked;lsSet('dc_ctx',ctxOn);updatePv();return;}
  if(t.dataset&&t.dataset.var){const p=byId[route.id];if(p){valsOf(p)[t.dataset.var]=t.value;updatePv();}return;}
  if(t.dataset&&'area' in t.dataset){area=t.value;lsSet('dc_area',area);toast(area?'Área guardada: '+area:'Área quitada');rerender();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideSugs();document.body.classList.remove('menu');return;}
  const t=e.target;
  if(e.key==='ArrowDown'&&t.classList&&t.classList.contains('sq')){const a=t.closest('.sbox').querySelector('.sug:not([hidden]) .si[href]');if(a){e.preventDefault();a.focus();}}
  else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&t.classList&&t.classList.contains('si')){
    const all=[...t.closest('.sug').querySelectorAll('.si[href]')];const i=all.indexOf(t);
    const nx=all[i+(e.key==='ArrowDown'?1:-1)];e.preventDefault();
    if(nx)nx.focus();else if(e.key==='ArrowUp')t.closest('.sbox').querySelector('.sq').focus();
  }
});
window.addEventListener('hashchange',render);
setInterval(()=>{const i=document.querySelector('.hero .sq');if(i&&document.activeElement!==i&&!i.value){i.placeholder=PH[Math.floor(Date.now()/3200)%PH.length];}},1600);

/* ---------- arranque ---------- */
render();
(function(){const i=document.querySelector('.hero .sq');if(i)i.placeholder=PH[0];})();
</script>
</body>
</html>
