<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompts DBEE · Bienestar y Experiencia del Estudiante · UniSabana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --pri:#00205B;--sec:#00387B;
  --bg:#F5F8FD;--surf:#FFFFFF;--surf2:#EEF3FC;--ink:#0A1A3F;--mut:#586A8E;--line:#DFE7F4;
  --tint:#E8F0FF;--tint2:#D3E2FF;--link:#00387B;--numbg:#00387B;
  --btn1:#00205B;--btn2:#00387B;--side:#FFFFFF;
  --glow1:rgba(0,56,123,.20);--glow2:rgba(0,32,91,.12);
  --shadow:0 1px 2px rgba(0,32,91,.05),0 8px 24px rgba(0,32,91,.07);
  --shadow-lg:0 12px 44px rgba(0,32,91,.15);
  --ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --disp:'Playfair Display',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#040B20;--surf:#0A1736;--surf2:#0E1F47;--ink:#EAF1FF;--mut:#9BB0D8;--line:#173064;
    --tint:#102454;--tint2:#1B3A80;--link:#9CC0FF;--numbg:#0A4DA8;--btn1:#00387B;--btn2:#0A4DA8;--side:#071230;
    --glow1:rgba(40,110,220,.30);--glow2:rgba(0,56,123,.35);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#040B20;--surf:#0A1736;--surf2:#0E1F47;--ink:#EAF1FF;--mut:#9BB0D8;--line:#173064;
  --tint:#102454;--tint2:#1B3A80;--link:#9CC0FF;--numbg:#0A4DA8;--btn1:#00387B;--btn2:#0A4DA8;--side:#071230;
  --glow1:rgba(40,110,220,.30);--glow2:rgba(0,56,123,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 44px rgba(0,0,0,.5);
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:8px}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;display:grid;place-items:center;font-size:19px;flex:none;box-shadow:0 4px 14px rgba(0,56,123,.35)}
.brand b{display:block;font-size:16px;line-height:1.15}
.brand small{display:block;font-size:11.5px;color:var(--mut);line-height:1.25}
.nl{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;font-weight:500;font-size:14px;color:var(--ink);border:0;background:transparent;width:100%;text-align:left}
.nl:hover{background:var(--surf2)}
.nl[aria-current="page"]{background:var(--tint);color:var(--link);font-weight:700}
.nl .em{width:22px;text-align:center;flex:none}
.nl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .ct{font-size:12px;color:var(--mut);font-weight:500}
.sl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:16px 10px 6px}
.nl.rc{font-size:13px;font-weight:400;color:var(--mut);padding:6px 10px}
.nl.rc:hover{color:var(--ink)}
.sfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;color:var(--mut);font-weight:600;padding:0 4px}
select.areaSel{width:100%;padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:var(--surf);color:var(--ink)}
.themeb{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surf);border-radius:11px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink)}
.themeb:hover{background:var(--surf2)}
.col{min-width:0}
.mtop{display:none}
.main{padding:0 clamp(16px,4vw,52px) 80px;outline:none}
.in{max-width:1040px;margin:0 auto}
.scrim{display:none}

/* ---------- HOME ---------- */
.hero{position:relative;isolation:isolate;text-align:center;padding:clamp(34px,8vw,86px) 0 18px}
.hero::before{content:"";position:absolute;left:-12%;right:-12%;top:-30px;height:460px;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 250px at 24% 32%,var(--glow1),transparent 72%),radial-gradient(500px 230px at 78% 22%,var(--glow2),transparent 72%);filter:blur(8px)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 8px;font-size:13px;font-weight:600;color:var(--mut);box-shadow:var(--shadow)}
.pill i{font-style:normal;background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;border-radius:999px;padding:1px 8px;font-size:12px}
.hero h1{font-family:var(--disp);font-size:clamp(32px,6vw,56px);line-height:1.08;letter-spacing:-.01em;margin:18px 0 12px;font-weight:700;
  background:linear-gradient(120deg,var(--ink) 20%,var(--link) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{max-width:620px;margin:0 auto;color:var(--mut);font-size:clamp(15px,2vw,17.5px)}
.sbox{position:relative;max-width:720px;margin:28px auto 0;text-align:left}
.comp{display:flex;align-items:center;gap:10px;background:var(--surf);border:1.5px solid var(--line);border-radius:22px;padding:9px 9px 9px 18px;box-shadow:var(--shadow-lg);transition:border-color .2s,box-shadow .2s}
.comp:focus-within{border-color:var(--link);box-shadow:0 0 0 4px var(--tint2),var(--shadow-lg)}
.comp .mg{color:var(--mut);font-size:18px}
.comp input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;padding:10px 0}
.comp input::placeholder{color:var(--mut)}
.go{width:44px;height:44px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;font-size:19px;flex:none}
.go:hover{filter:brightness(1.12)}
.sbox.sm{margin:0;max-width:none}
.sbox.sm .comp{box-shadow:var(--shadow);border-radius:16px;padding:4px 5px 4px 14px}
.sbox.sm .comp input{font-size:15px;padding:9px 0}
.sbox.sm .go{width:38px;height:38px;border-radius:11px;font-size:16px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);z-index:30;overflow:hidden}
.sug[hidden]{display:none}
.si{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line)}
.si:hover,.si:focus-visible{background:var(--tint);outline:none}
.si .e{font-size:20px;line-height:1.3}
.si b{display:block;font-size:14.5px;line-height:1.3}
.si span{display:block;font-size:12.5px;color:var(--mut);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60ch}
.si.all{color:var(--link);font-weight:700;font-size:14px;border-bottom:0;justify-content:center}
.try{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.try button{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink)}
.try button:hover{border-color:var(--link);background:var(--tint)}
.myarea{margin:18px auto 0;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.myarea select{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-size:13px}

.sec{margin-top:42px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.sh h2{font-size:20px;font-weight:700;letter-spacing:-.005em}
.sh p{color:var(--mut);font-size:14px;margin-top:2px}
.sh a{color:var(--link);font-weight:700;font-size:14px;white-space:nowrap}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hw{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.hw .n{width:30px;height:30px;border-radius:50%;background:var(--numbg);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.hw h3{font-size:16px;margin-bottom:4px}
.hw p{color:var(--mut);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--link)}
.tile .ic{width:44px;height:44px;border-radius:13px;background:var(--tint);display:grid;place-items:center;font-size:22px;margin-bottom:4px}
.tile h3{font-size:16px;line-height:1.25}
.tile p{color:var(--mut);font-size:13.5px}
.tile .ct{margin-top:auto;padding-top:6px;font-size:12.5px;font-weight:700;color:var(--link)}

/* ---------- LISTAS / TARJETAS ---------- */
.vh{padding:clamp(22px,4vw,40px) 0 6px}
.crumbs{font-size:13px;color:var(--mut);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--link);font-weight:600}
.crumbs a:hover{text-decoration:underline}
.vh h1{font-size:clamp(24px,4vw,34px);line-height:1.15;letter-spacing:-.01em;font-weight:700}
.vh .d{color:var(--mut);margin-top:6px;max-width:700px}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 8px}
.bar2 .sbox{flex:1;min-width:220px}
.pills{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{height:0}
.pl2{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink)}
.pl2:hover{border-color:var(--link)}
.pl2[aria-pressed="true"],.pl2[aria-current="page"]{background:var(--numbg);border-color:var(--numbg);color:#fff}
.cnt{margin-left:auto;font-size:13px;color:var(--mut);padding-left:8px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pc{position:relative;display:flex;flex-direction:column;gap:7px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.pc:hover{transform:translateY(-2px);border-color:var(--link)}
.pc .top{display:flex;justify-content:space-between;align-items:center}
.pc .ic{width:38px;height:38px;border-radius:11px;background:var(--tint);display:grid;place-items:center;font-size:19px}
.pc h3{font-size:16.5px;line-height:1.28;font-weight:700}
.pc h3 a::after{content:"";position:absolute;inset:0;border-radius:18px}
.pc .wh{font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc .wh b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.chip{background:var(--tint);color:var(--link);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.chip.ar{background:transparent;border:1px solid var(--line);color:var(--mut)}
.chip.ok{background:var(--numbg);color:#fff}
.chip.need{background:transparent;border:1px dashed var(--mut);color:var(--mut)}
.step.ok1{background:var(--tint);border-color:var(--tint2);box-shadow:none}
.star{position:relative;z-index:2;border:0;background:transparent;font-size:21px;line-height:1;color:var(--mut);padding:5px;border-radius:9px}
.star:hover{color:var(--link);background:var(--tint)}
.star.on{color:var(--link)}
.empty{padding:48px 16px;text-align:center;color:var(--mut);background:var(--surf);border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.empty .try{margin-top:14px}
.hint{color:var(--mut);font-size:14px}

/* ---------- DETALLE ---------- */
.info3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0 22px}
.inf{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.inf h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--link);margin-bottom:5px}
.inf p{font-size:14.5px}
.dgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
.stk{position:sticky;top:calc(14px + env(safe-area-inset-top,0px))}
.step{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.step>h3{display:flex;gap:10px;align-items:center;font-size:15.5px;margin-bottom:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--numbg);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.ul li{position:relative;padding-left:16px;margin-bottom:5px;font-size:14px}
.ul li::before{content:"•";position:absolute;left:3px;color:var(--link)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fld textarea{min-height:90px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 3px var(--tint2)}
.tg{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--mut);cursor:pointer}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pvh h3{margin:0!important}
.pv{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:min(52vh,520px);overflow:auto}
.pv .ctx{opacity:.6;display:block;border-bottom:1px dashed var(--line);margin-bottom:10px;padding-bottom:10px}
.pv mark{background:var(--tint2);color:var(--ink);border-radius:5px;padding:0 4px}
.pv .fill{border-bottom:2px solid var(--link)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 6px 18px rgba(0,56,123,.28)}
.btn:hover{filter:brightness(1.12)}
.btn.big{width:100%;margin-top:12px;font-size:16px;padding:14px}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600;padding:10px 14px;font-size:14px}
.btn.ghost:hover{border-color:var(--link);background:var(--tint)}
.ai{display:flex;gap:8px;flex-wrap:wrap}
.tip{border-left:4px solid var(--link)}
.src{font-size:12.5px;color:var(--mut);margin-top:6px}
.nx{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.nx a{display:block;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.nx a:hover{border-color:var(--link)}
.nx a small{display:block;color:var(--mut);font-size:12.5px;margin-bottom:2px}
.mbar{display:none}

/* ---------- HERRAMIENTAS / REGLAS / GUÍA ---------- */
.tc{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.tc h3{font-size:16.5px;line-height:1.28}
.tc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--tint);color:var(--link)}
.badge.live{background:var(--numbg);color:#fff}
.tc .rs{font-size:13px;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px}
.lnk{color:var(--link);font-weight:700;word-break:break-all;font-size:14px}
.lnk:hover{text-decoration:underline}
.rl{display:grid;gap:12px;counter-reset:r}
.rule{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px 18px 16px 62px;box-shadow:var(--shadow)}
.rule::before{counter-increment:r;content:counter(r);position:absolute;left:16px;top:15px;width:32px;height:32px;border-radius:50%;background:var(--numbg);color:#fff;display:grid;place-items:center;font-weight:700}
.rule h3{font-size:16.5px;margin-bottom:3px}
.rule p{color:var(--mut);font-size:14px;margin-bottom:8px}
.lk{display:flex;gap:6px;flex-wrap:wrap}
.lk a{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--link)}
.lk a:hover{border-color:var(--link)}
.faq details{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:700;font-size:15px}
.faq details[open] summary{margin-bottom:6px}
.faq p{color:var(--mut);font-size:14.5px}
table.mp{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
table.mp td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.mp tr:last-child td{border-bottom:0}
table.mp td:first-child{font-weight:600;width:48%}
table.mp a{color:var(--link);font-weight:700}
.tw{overflow-x:auto}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center}
.foot a{color:var(--link);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--pri);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;border:1px solid rgba(255,255,255,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- MÓVIL / TABLET ---------- */
@media (max-width:980px){
  .app{display:block}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);height:auto;z-index:70;transform:translateX(-102%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg)}
  body.menu .side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(0,12,40,.55);z-index:60}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surf);border-bottom:1px solid var(--line);padding:9px 14px}
  .mtop .logo{width:32px;height:32px;border-radius:10px;font-size:16px}
  .mtop b{font-size:15px;flex:1}
  .ib{border:1px solid var(--line);background:var(--surf);border-radius:11px;width:40px;height:40px;font-size:18px}
  .how{grid-template-columns:1fr}

/* ===== Material institucional que viaja DENTRO de los prompts (para que funcionen en un chat vacío) ===== */
const REF_MODELO=`MODELO DE BIENESTAR INSTITUCIONAL · UNIVERSIDAD DE LA SABANA (resumen del documento oficial)
- Se concibe como un ecosistema que integra programas, estrategias, personas y acciones para enriquecer la experiencia de la comunidad universitaria y favorecer la permanencia, la calidad y el desempeño.
- Tres propósitos: (1) formación integral para la vida; (2) calidad de vida; (3) desempeño académico y profesional.
- Núcleo: la persona (única, perfectiva, social y comunicativa), vista de forma individual o como grupo de personas.
- Seis dimensiones del ser humano: física-biológica, psicológica-afectiva, cognitiva-intelectual, social-cultural, ética-moral y espiritual-trascendente.
- Tres principios del eje de cuidado: cuidado de sí mismo (autocuidado), cuidado del otro y cuidado del entorno.
- Eje formativo: las acciones de bienestar son intencionalmente formativas y aportan a la competencia de liderazgo transformador y a UniSabana Xperience.
- Eje relacional («engranajes»): redes de apoyo y articulación interna y externa; el bienestar es una corresponsabilidad de todas las personas, no de una sola unidad.
- Frentes de experiencias significativas y transformadoras: Bienestar a la medida; Actividad física y desarrollo deportivo; Arte y cultura; Salud integral; Talento Sabana; Capellanía universitaria; Redes de alto impacto.
- Facilitadores: Campus 3S (seguro, saludable y sostenible) y UniSabana Familiarmente Responsable.
- Seis tareas de la Dirección de Bienestar y Experiencia del Estudiante (DBEE): estrategias de éxito académico; personalizar el servicio con el 360º del estudiante; promoción y prevención para una vida plena y la salud integral; desarrollar competencias de manera intencionada; formar estudiantes líderes con actitud de servicio e impacto tangible; e impulsar el arte, la cultura, el deporte y la actividad física hacia un bienestar perfectivo.`;

const REF_XPERIENCE=`UNISABANA XPERIENCE (resumen del documento maestro institucional)
- Es el modelo académico institucional de la Universidad de La Sabana (materializa la Visión 2029). Integra currículo, pedagogía, experiencia universitaria, internacionalización, tecnología, humanismo y relación con el entorno. Aplica a quienes ingresan desde 2026-2. NO es un programa académico, ni una metodología aislada, ni una plataforma, ni una iniciativa complementaria.
- Cuatro rasgos formativos: (1) CoInteligencia: integración ética y estratégica entre inteligencia humana e inteligencia artificial. (2) Actitud Humanizadora: sello distintivo (dignidad humana, ética, solidaridad, servicio, cultura, arte, trascendencia). (3) Conexión Global: inglés, tercera lengua, movilidad, interculturalidad, doble titulación, COIL. (4) Conexión con el Entorno: aprender transformando realidades (retos, proyectos, aprendizaje servicio, investigación aplicada).
- Cuatro componentes: Flexibilidad; Profesores, Maestros de Vida; Aprendizaje Experiencial; Experiencia Universitaria Transformadora (integra bienestar, cultura, deporte, internacionalización, liderazgo y vida universitaria).
- Rol de Bienestar: protagonista en Actitud Humanizadora y en Conexión con el Entorno (cultura, arte, deporte, solidaridad, desarrollo humano, acompañamiento estudiantil).
- Cinco metacompetencias: Desarrollar Actitud Humanizadora; Ejercer Liderazgo Transformador; Cultivar Ciudadanía Global; Innovar y Ser Creativo; Desarrollar CoInteligencia.
- Experiencias Xperience: PAT (Programa Aprendamos a Trabajar), HIX, Semilleros, Challenges, Voluntariado e Internacionalización.
- HIX (High Impact Experiences, experiencias de alto impacto). Ocho elementos de calidad: altas expectativas; tiempo y esfuerzo; interacción significativa; diversidad de contextos; retroalimentación permanente; reflexión guiada; aplicación real; demostración pública. HIX complementarias: grupos representativos, voluntariado, desarrollo deportivo, movilidad, monitorías, becas formativas y retos cocurriculares.
- Reglas para comunicar: explicar primero los rasgos y luego los componentes; nunca llamarlo plataforma; nunca reducirlo a IA; relacionar siempre tecnología y humanismo; usar ejemplos reales; destacar el aprendizaje experiencial y la construcción de la hoja de vida desde el primer día.`;

const REF_GRUPOS=`LOS 15 GRUPOS ARTÍSTICOS REPRESENTATIVOS
Música: Coro · Orquesta Sinfónica UniSabana (OSUS) · Tuna Masculina · Tuna Femenina · Fusión · US Band · Puente Rojo (pop) · Punto Rock (rock) · Entre Mares · Vallenato y Parranda · Repercusión.
Danza: Danza Folclórica Ancestros · Salsa y Bachata Saoko · Danza Urbana Génesis.
Teatro: Grupo de Teatro.`;

const CRIT_ITEMS=`Criterios de redacción base (si tu equipo tiene su propia lista, pégala en el campo de criterios propios y úsala en su lugar):
1. Una sola idea por ítem (sin ítems dobles).
2. Lenguaje claro y sencillo; sin tecnicismos ni coloquialismos.
3. Sin palabras ambiguas o subjetivas («relevante», «difícil», «principal», «oportunamente»).
4. Redacción afirmativa; evitar negaciones.
5. Conducta observable, no conocimiento ni intención.
6. Sin deseabilidad social evidente (que la respuesta «correcta» no sea obvia).
7. Sin traslape con otros ítems del mismo indicador ni de otros indicadores.
8. Mismo marco temporal en todos los ítems.
9. Primera persona y estructura consistente.
10. Evitar absolutos («siempre», «nunca») salvo que midan frecuencia.
11. Enunciados cortos y de longitud similar.
12. Escala de respuesta coherente con el enunciado.
13. No mezclar lo cognitivo con lo metacognitivo ni con lo socioemocional.`;

 vars:[T('tipo','Tipo de contenido','informe de semestre, propuesta, lanzamiento…'),S('publico','Público',['Estudiantes','Docentes y maestros','Directivos y comités','Externos']),T('n','Número de diapositivas','10'),S('formato','Formato',['Presentación HTML interactiva','PowerPoint (.pptx)']),A('contenido','Contenido o mensajes clave','Pega aquí tus notas o ideas')],

 tips:['Pide primero el texto y luego el formato (Word, correo): así corriges contenido y diseño por separado.','Si dudas entre dos tonos, pide «dos versiones etiquetadas» y escoge una.'],

{id:'continuar-chat',cat:'base',t:'Retomar el trabajo en un chat nuevo (traspaso)',

 body:`Convierte el contenido fuente en un EXPEDIENTE COMITÉ en Word (.docx), con el formato institucional de la Dirección de Bienestar y Experiencia del Estudiante (DBEE) de la Universidad de La Sabana. El formato completo está descrito abajo: no necesitas ningún archivo de plantilla.

DATOS
- Asunto: {{titulo}}
- Ponente: {{ponente}}
- Fecha: {{fecha}}
- Tipo de impacto: {{impacto}}
- Jefaturas que revisan: {{jefaturas}}

CONTENIDO FUENTE
{{fuente}}

FORMATO OFICIAL (reprodúcelo tal cual; no lo rediseñes)
1. Encabezado centrado y en negrita: «EXPEDIENTE COMITÉ» y debajo «DIRECCIÓN DE BIENESTAR Y EXPERIENCIA DEL ESTUDIANTE».
2. «Tipo de impacto» (con llamada a la nota al pie 1) y una tabla de tres columnas: OPERATIVO | TÁCTICO | ESTRATÉGICO, con una «x» bajo la opción elegida.
3. Tabla de dos columnas: «Fecha: …» | «Ponente: …» y, debajo, una fila combinada con «Asunto: …».
4. Tabla de revisión por jefaturas, con siete columnas y una «x» bajo cada jefatura que revisa: Director de Bienestar y Experiencia del Estudiante · Jefatura de Experiencia del Estudiante · Jefatura de Desarrollo Cultural, Protocolo y Eventos · Jefatura de Éxito Académico · Jefatura de Prevención y Salud · Jefatura de Desarrollo Deportivo · Jefatura de Gestión de Becarios.
5. «1. ANTECEDENTES»: contexto breve de por qué se presenta la propuesta.
6. «2. PROPUESTA» (con llamada a la nota al pie 2). Dentro, subtítulos en negrita según corresponda a la iniciativa (por ejemplo: Nombre, Objetivo general, Población objetivo, Descripción y justificación, Desarrollo, Requisitos de participación, Recursos y difusión). Usa solo los que la fuente respalde.
7. «3. CRONOGRAMA TENTATIVO»: tabla de dos columnas: Actividad | Fecha.
8. «4. PRESUPUESTO ESTIMADO»: tabla de dos columnas: Concepto | Valor estimado (COP), con una fila de total.
9. Notas al pie (texto exacto):

   - Nota 2: «Planteamiento claro y concreto de la alternativa que se pone a consideración para su aprobación.»
10. Estilo: Arial; títulos de sección en MAYÚSCULAS, negrita y subrayados; encabezados de tabla en azul #00205B con texto blanco; cierre con un párrafo de firma del ponente.

- Reproduce solo lo que está en la fuente, ordenado bajo sus títulos. No agregues secciones, contexto ni citas que no pedí.

{id:'carta-constancia',cat:'docs',t:'Circular institucional «a quien corresponda» (participación de un estudiante)',
 d:'Circular de una página, ya redactada, para avisar a coordinadores y directores que un estudiante participa en un evento y proteger su horario.',
 out:['Word','PDF'],attach:[],
 vars:[T('fechacarta','Fecha de la carta','por ejemplo, 18 de septiembre de 2026'),T('nombre','Nombre completo del estudiante'),T('programa','Programa académico'),T('evento','Evento o actividad'),T('fecha','Fecha y horario de la participación','por ejemplo, domingo 20 de septiembre, desde las 7:00 a. m.'),T('lugar','Lugar','por ejemplo, Campus Puente del Común'),T('area','Área que emite la carta','por ejemplo, la Jefatura de Desarrollo Cultural'),T('firmante','Nombre y cargo de quien firma')],
 body:`Genera en Word (.docx), en una sola página, la siguiente circular institucional de la Universidad de La Sabana. Conserva la estructura y el tono del texto base y ajusta únicamente los datos.

FORMATO
- Encabezado con un espacio reservado para el logo institucional (no inventes ni dibujes un logo).
- Colores #00205B y #00387B solo en el encabezado y en el asunto; Arial 11; márgenes normales.
- Pie de página: «Universidad de La Sabana · Campus Puente del Común, Km 7 Autopista Norte, Chía, Cundinamarca».

TEXTO BASE
Chía, {{fechacarta}}

A QUIEN CORRESPONDA
Coordinadores y directores

Asunto: Participación de {{nombre}} en {{evento}}

Cordial saludo.

Por medio de la presente, la Dirección de Bienestar y Experiencia del Estudiante, a través de {{area}}, se permite informar que {{nombre}}, estudiante de {{programa}}, participará en {{evento}}, que se realizará el {{fecha}}, en {{lugar}}.

Su participación hace parte de las actividades institucionales de Bienestar. Por esta razón, de manera respetuosa solicitamos que no se le asignen otras responsabilidades académicas ni administrativas durante ese horario, de modo que pueda cumplir con este compromiso.

Agradecemos de antemano su comprensión y su apoyo al desarrollo integral de nuestros estudiantes.

Cordialmente,

{{firmante}}
Dirección de Bienestar y Experiencia del Estudiante

IMPORTANTE
- Es un aviso institucional dirigido «A quien corresponda»; NO es una carta dirigida al estudiante.
- No agregues datos personales más allá del nombre y el programa.
- Si algún dato quedó vacío o entre corchetes, márcalo con ⚠ y pregúntamelo; no lo inventes.
- Entrégame el archivo Word y, al final, el texto en el chat por si quiero pegarlo en un correo.`,
 tips:['Error frecuente: la primera versión se redactó dirigida al estudiante. El texto base ya corrige esto.','Para varios estudiantes, pide una sola circular con una tabla de nombres y programas.','Confirma el nombre completo de quien firma y su cargo.'],
 src:'Carta de confirmación de participación para el Día de la Familia'},

{id:'acta',cat:'docs',t:'Acta de reunión clara y breve',
 d:'Ordena notas desordenadas o dictadas en un acta con decisiones, compromisos, responsables y pendientes.',
 out:['Word'],attach:[],
 vars:[T('reunion','Reunión'),T('fecha','Fecha'),T('asistentes','Asistentes'),A('notas','Notas (pueden estar desordenadas o dictadas)')],
 body:`Estructura un ACTA DE REUNIÓN a partir de mis notas.

REUNIÓN: {{reunion}}
FECHA: {{fecha}}
ASISTENTES: {{asistentes}}

NOTAS:
{{notas}}

FORMATO (Word, una a dos páginas)
1. Datos de la reunión (tabla de dos columnas)
2. Temas tratados: viñetas cortas, un tema por viñeta
3. Decisiones tomadas: lista numerada
4. Compromisos: tabla con Tarea | Responsable | Fecha
5. Pendientes o puntos por confirmar: marcados con ⚠
6. Próxima reunión

REGLAS
Usa solo lo que aparece en mis notas. Si un responsable o una fecha no se mencionó, escribe «Por definir» y lístalo en pendientes. Lenguaje claro, sin jerga ni relleno.`,
 tips:['Si grabas la reunión, pega la transcripción en lugar de notas y pide que separe decisiones de discusiones.','Agrega «y un correo de seguimiento de cinco líneas con los compromisos».'],
 src:'Función de asistente: estructurar actas de reunión'},

{id:'informe-1pg',cat:'docs',t:'Informe ejecutivo de una página',
 d:'Logros, pendientes, dificultades y próximos pasos en una sola hoja, con cifras reales y sin encuadres de déficit.',
 out:['Word'],attach:['~Informe o datos base, si son largos'],
 vars:[T('proyecto','Proyecto o área'),T('periodo','Periodo','2026-2'),A('datos','Información base')],
 body:`Elabora un INFORME EJECUTIVO DE UNA PÁGINA sobre {{proyecto}} para el periodo {{periodo}}.

INFORMACIÓN BASE:
{{datos}}

ESTRUCTURA (cabe en una hoja de Word)
- Logros: 3 a 5 viñetas con cifras reales.
- Pendientes: con responsable y fecha cuando existan.
- Dificultades: dichas con claridad y sin dramatismo, cada una con la acción que se está tomando.
- Próximos pasos: máximo 5, en orden de prioridad.

REGLAS
- Solo cifras y hechos de la información base; no estimes ni redondees a favor.
- Nada de encuadres de déficit («faltan X para la meta»): muestra avance y qué sigue.
- Colores #00205B y #00387B en encabezados; letra legible, sin saturar la hoja.
- Comprueba que cabe en una página (conviértelo a PDF y revísalo) antes de entregar.`,
 tips:['Para reportes semestrales con muchos datos, hazlo primero como dashboard (categoría Datos) y deja esta hoja como resumen.'],
 src:'Función de asistente: informes ejecutivos de una página'},

/* ================= EVENTOS ================= */
{id:'cronograma-vivo',cat:'eventos',t:'App de cronograma en vivo para un evento (sin login)',
 d:'Página que muestra en qué momento va el evento y quién responde por cada actividad, con cuenta regresiva y gestión de retrasos desde un archivo.',
 out:['HTML'],attach:['~Excel con frentes, responsables y contactos'],
 vars:[T('evento','Evento'),T('fecha','Fecha'),T('lugar','Lugar'),A('programa','Programa (orden y horarios exactos)'),A('frentes','Responsables por frente')],
 body:`Construye una app web de seguimiento en vivo para {{evento}} ({{fecha}}, {{lugar}}), para que todo el equipo y los invitados vean en qué momento va el evento y quién responde por cada actividad, sin iniciar sesión.

PROGRAMA (orden y horarios exactos):
{{programa}}

RESPONSABLES Y FRENTES:
{{frentes}}

FUNCIONES
- Hora oficial de Colombia (America/Bogota): actividad actual, siguiente y barra de progreso.
- Cuenta regresiva en el encabezado hasta el inicio; estado «Montaje» el día anterior.
- Gestión de retraso: la app lee un archivo retraso.json (por ejemplo {"retraso": 12}) cada 20 segundos y corre todo el cronograma esos minutos, mostrando una insignia «Retraso: X min».
- Simulación para ensayar con parámetros en la URL: ?hora=15:20&retraso=12
- Interfaz limpia y dinámica, sin pestañas que sobren; metadatos Open Graph para la vista previa en WhatsApp.

ENTREGA
Un solo archivo index.html listo para subir a GitHub y desplegar en Vercel sin configuración de build. Explícame, paso a paso y sin tecnicismos, cómo crear y editar retraso.json desde el navegador de GitHub.`,
 tips:['El retraso solo funciona en la versión alojada (GitHub/Vercel), no en la vista previa del chat.','Si no quieres calcular el retraso, avisa «el grupo X empezó a las H:MM» y pide solo el número para pegar.','Si hay una sección protegida (guion del anfitrión), pide guardar solo el hash de la clave, nunca la clave en texto plano; y no publiques claves en el repositorio.','Quita las pestañas que nadie usa: en el Día de la Familia se eliminaron «Equipo» y «Pendientes».'],
 src:'Festival Solidario de Tunas, Día de la Familia e Inducciones 2026-1 y 2026-2'},

{id:'guion-anfitrion',cat:'eventos',t:'Guion del anfitrión por bloques',
 d:'Guion para leer en voz alta, con cuatro bloques por participante, tiempos de lectura calculados y solo datos verificados.',
 out:['Word','HTML'],attach:[],
 vars:[T('evento','Evento'),A('grupos','Participantes y datos verificados de cada uno'),T('minutos','Duración de cada intervención','50 a 60 segundos')],
 body:`Escribe el guion del anfitrión para {{evento}}.

PARTICIPANTES Y DATOS VERIFICADOS:
{{grupos}}

PARA CADA PARTICIPANTE
Cuatro bloques cortos: Origen · Trayectoria · Hitos · Hoy, más una línea final de llamado a escena. Duración de lectura: {{minutos}} a 140 palabras por minuto.

REGLAS DE ORO
- Usa SOLO los datos que te di. No inventes logros, años, reconocimientos ni adjetivos de ranking («una de las pocas…», «la más grande…»).
- Si falta un dato, escribe ⚠ [dato pendiente] en vez de rellenar.
- Frases pensadas para leerse en voz alta: cortas, con ritmo natural, sin tecnicismos.
- Incluye una tabla con el tiempo estimado de lectura por bloque.
- Quita cualquier sección que yo no haya pedido.`,
 tips:['En eventos reales se detectaron descripciones inventadas y competencias mal nombradas; la regla «solo datos verificados» es la más importante de este prompt.','Si el guion se lee en vivo, pide una vista de «lo que leo ahora» y «lo que sigue», con tamaño de letra ajustable.'],
 src:'Guiones de Inducciones 2026-2 y del Festival de Tunas'},

{id:'cronograma-festival',cat:'eventos',t:'Cronograma de festival con duraciones y transiciones',
 d:'Arma el programa hora por hora, con cálculos visibles, reglas de equidad entre géneros o universidades y exportación a Excel.',
 out:['Excel','Texto'],attach:[],
 vars:[T('evento','Evento'),T('inicio','Hora de inicio'),T('tope','Hora máxima de cierre'),A('bloques','Bloques y duración de cada uno (incluye transición)'),A('participantes','Universidades o grupos participantes')],
 body:`Ayúdame a armar el cronograma de {{evento}}.

INICIO: {{inicio}} · CIERRE MÁXIMO: {{tope}}

BLOQUES Y DURACIONES (incluyendo transiciones):
{{bloques}}

PARTICIPANTES:
{{participantes}}

ENTREGA
1. Tabla hora por hora con presentaciones y transiciones.
2. Cálculo explícito de cada subtotal (por ejemplo, 4 grupos × 20 min = 80 min) y hora de cierre resultante.
3. Si excede el tope, propón dos ajustes con su efecto en minutos.
4. Equidad: no favorezcas a un género ni a una universidad; avísame si el número de invitados por bloque es desigual.
5. Versión para copiar a Excel (CSV) y en texto simple.

Antes de entregar, recalcula todas las sumas y confírmame que lo hiciste.`,
 tips:['En la práctica se cometieron errores de cuentas simples (4 × 20 no es 100): pide siempre los subtotales visibles.','Para reutilizarlo, pide una herramienta HTML con bloques dinámicos que recalcule en vivo y exporte CSV y JSON; con fondo blanco si es un documento de trabajo interno.'],
 src:'Festival de danza Sabana Baila / Universidades Bailan por Colombia'},

{id:'carta-invitacion',cat:'eventos',t:'Carta de invitación a universidades + correo breve',
 d:'Carta formal ya redactada, con saludo genérico para envío masivo, tono cálido y componente solidario voluntario, más un correo breve para acompañarla.',
 out:['Word','Texto'],attach:['~Membrete institucional, si lo tienes'],
 vars:[T('fechacarta','Fecha de la carta'),T('invitados','Dirigida a','por ejemplo, las universidades invitadas'),T('evento','Nombre del evento'),T('fecha','Fecha y hora'),T('lugar','Lugar'),A('proposito','En una o dos frases, ¿para qué es el evento?'),T('solidario','Componente solidario (opcional)','por ejemplo, traer alimentos no perecederos como gesto voluntario','',true),T('limite','Confirmar antes de'),T('contacto','Contacto para confirmar','correo o teléfono'),T('firmante','Nombre y cargo de quien firma')],
 body:`Redacta una carta formal de invitación en Word (.docx) y un correo breve que la acompañe. Parte del texto base y ajusta solo los datos.

TEXTO BASE DE LA CARTA
Chía, {{fechacarta}}

Señores
{{invitados}}

Asunto: Invitación a {{evento}}

Cordial saludo.

La Dirección de Bienestar y Experiencia del Estudiante de la Universidad de La Sabana tiene el gusto de invitarlos a {{evento}}, que se realizará el {{fecha}} en {{lugar}}.

{{proposito}} (redáctalo en uno o dos párrafos breves, con calidez, usando solo lo que te di)

Componente solidario: {{solidario}}. Si dice «ninguno», omite este párrafo. Si existe, preséntalo como un gesto voluntario de quienes asistan, nunca como un requisito para las delegaciones.

Les agradecemos confirmar su participación antes del {{limite}} escribiendo a {{contacto}}.

Será un honor contar con su presencia.

Cordialmente,

{{firmante}}
Dirección de Bienestar y Experiencia del Estudiante

REGLAS PARA LA CARTA
- Saludo genérico, para envío masivo (no personalizado por institución).
- Tono cálido y no obligatorio: se invita, no se exige.
- Una página; datos clave (fecha, hora, lugar) bien visibles; deja un espacio para el logo sin inventarlo.
- Si falta un dato (por ejemplo, el nombre definitivo del evento o la fecha límite), márcalo con ⚠ en vez de inventarlo.

CORREO QUE ACOMPAÑA LA CARTA
Cuatro a seis líneas: saludo, presentación de la carta adjunta, datos esenciales y petición de confirmación.`,
 tips:['Si el evento cambia de nombre o de enfoque, pide también una versión de actualización además del texto original.','Evita frases que suenen a condición («es necesario traer…») en los componentes solidarios.'],
 src:'Carta a siete universidades para un festival de danza'},

{id:'checklist-evento',cat:'eventos',t:'Lista de tareas de evento: de la planeación a la evaluación',
 d:'Plan en Excel con fases, responsables, fechas en semanas previas, alertas críticas y hoja de evaluación.',
 out:['Excel'],attach:['~Excel con el equipo y los roles'],
 vars:[T('evento','Evento'),T('fecha','Fecha'),T('aforo','Aforo aproximado'),T('grupos','Grupos o actividades involucradas'),A('equipo','Equipo y roles')],
 body:`Crea la lista de tareas completa para {{evento}} ({{fecha}}), con aproximadamente {{aforo}} participantes.

CONTEXTO: {{grupos}}
EQUIPO Y ROLES:
{{equipo}}

ENTREGA (Excel .xlsx)
- Hoja 1 «Plan»: Fase (Planeación · Convocatoria · Logística · Producción · Día del evento · Cierre y evaluación) | Tarea | Responsable | Fecha límite en semanas antes del evento (T-6, T-4…) | Estado | Notas.
- Hoja 2 «Alertas»: tareas críticas con dependencia (sonido, permisos, backline, refrigerios, comunicaciones) y qué pasa si se retrasan.
- Hoja 3 «Evaluación»: indicadores y preguntas para el cierre.
- Estado con lista desplegable y formato condicional.

Marca con ⚠ lo que dependa de una decisión mía; no asumas presupuestos ni proveedores.`,
 tips:['Alimenta los frentes y responsables con el Excel del equipo; no dejes que se inventen nombres.','Cada semana puedes pedir: «dame las alertas de lo que vence en 10 días».'],
 src:'Función de asistente: listas de tareas de evento'},

{id:'solicitud-gr',cat:'eventos',t:'Responder a una solicitud de un grupo representativo para un evento',
 d:'Respuesta cálida que explica las condiciones para solicitar un grupo (anticipación, sonido, backline, refrigerios). Pensado para Cultura; adaptable a otros equipos.',
 out:['Texto'],attach:[],
 vars:[T('solicitante','Quién solicita'),T('evento','Evento y fecha'),T('grupo','Grupo solicitado','por ejemplo, Tuna Femenina')],
 body:`Redacta la respuesta a una solicitud de un grupo artístico representativo de la Universidad de La Sabana para un evento.

SOLICITANTE: {{solicitante}}
EVENTO Y FECHA: {{evento}}
GRUPO SOLICITADO: {{grupo}}

${REF_GRUPOS}

CONDICIONES QUE DEBE EXPLICAR (vigentes según el portafolio de grupos de abril de 2026; confírmalas antes de enviar)
- La solicitud se hace con mínimo 10 días de anticipación.
- Pertinencia del evento para el grupo y compromiso mutuo entre quien solicita y los estudiantes.
- Sonido: se requiere ingeniero de sonido, que tiene costo. Explica qué es el backline y por qué implica gasto. No lo necesitan el Coro, las Tunas ni Repercusión.
- Refrigerio para los estudiantes que se presentan.

TONO
Cálido y claro, sin sonar transaccional: celebra que quieran contar con los estudiantes y presenta las condiciones como una forma de cuidar la presentación. Si el grupo solicitado no parece el más adecuado para el evento, sugiere otro de la lista, con delicadeza.

ENTREGA
Un correo corto (máximo 150 palabras) y una versión para WhatsApp (tres líneas). Si falta algún dato del evento (aforo, escenario, horario), pregúntamelo antes de redactar.`,
 tips:['Verifica con tu jefatura que las condiciones sigan vigentes: provienen del portafolio de abril de 2026.','Si el solicitante no dio aforo ni escenario, pide primero esos datos en lugar de responder a ciegas.'],
 src:'Portafolio profesional de los 15 grupos y campaña de correo'}
